<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#67C8F0">
<title>LAST RUNNER</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#67C8F0; --deep:#12324A; --cream:#FFF8EC; --ink:#17202B;
  --red:#FF5B45; --blue:#37B7F5; --amber:#FFC53D; --green:#4BD08A;
  --f:"Baloo 2","Trebuchet MS",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden;background:#0B1A26;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{font-family:var(--f);color:var(--cream);font-weight:600}
::-webkit-scrollbar{display:none}
#app{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
.hidden{display:none !important}

/* ---------- HUD ---------- */
#hud{position:fixed;top:0;left:0;right:0;z-index:8;pointer-events:none;
  padding:max(12px,env(safe-area-inset-top)) 14px 0}
.bar{max-width:520px;margin:0 auto;background:rgba(23,32,43,.55);border:3px solid rgba(255,248,236,.9);
  border-radius:22px;height:26px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--amber);border-radius:22px;
  transition:width .12s linear}
.bar .flag{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:.8rem}
.pips{max-width:520px;margin:8px auto 0;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.pip{width:15px;height:15px;border-radius:50%;border:2px solid rgba(23,32,43,.5)}
.pip.out{opacity:.25}
.stats{max-width:520px;margin:8px auto 0;display:flex;justify-content:space-between;
  font-size:.9rem;letter-spacing:.04em;text-shadow:0 2px 0 rgba(23,32,43,.55)}
.stats b{font-size:1.3rem;font-weight:800}

/* ---------- Meldungen ---------- */
#big{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;
  pointer-events:none}
#big span{font-weight:800;font-size:clamp(3.4rem,17vw,8rem);color:var(--cream);
  -webkit-text-stroke:6px var(--ink);paint-order:stroke fill;animation:pop .45s ease-out}
@keyframes pop{from{transform:scale(1.6);opacity:0}to{transform:scale(1);opacity:1}}

#toast{position:fixed;left:50%;top:38%;transform:translateX(-50%);z-index:9;pointer-events:none;
  font-weight:800;font-size:1.5rem;color:var(--amber);-webkit-text-stroke:4px var(--ink);
  paint-order:stroke fill;animation:up .8s ease-out}
@keyframes up{0%{opacity:0;transform:translate(-50%,14px)}
  22%{opacity:1;transform:translate(-50%,-4px)}100%{opacity:0;transform:translate(-50%,-40px)}}

/* ---------- Overlays ---------- */
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(103,200,240,.55),rgba(18,50,74,.9))}
.card{width:100%;max-width:390px;max-height:100%;overflow-y:auto;text-align:center;
  background:var(--cream);color:var(--ink);border:4px solid var(--ink);border-radius:26px;
  box-shadow:0 12px 0 rgba(23,32,43,.35);padding:clamp(20px,4.5vh,30px) clamp(18px,5vw,26px)}
h1{font-weight:800;font-size:clamp(2rem,9vw,2.9rem);line-height:1;letter-spacing:.01em}
h1 span{color:var(--red)}
.sub{color:#5A6675;font-size:.94rem;margin:8px 0 4px;font-weight:600}
label{display:block;text-align:left;font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;
  color:#8A94A2;margin:16px 0 5px}
input{width:100%;background:#fff;border:3px solid var(--ink);border-radius:14px;color:var(--ink);
  font-family:var(--f);font-weight:700;font-size:1.05rem;letter-spacing:.14em;padding:10px;
  text-align:center;text-transform:uppercase}
input:focus{outline:none;border-color:var(--red)}
.btn{display:block;width:100%;margin-top:12px;padding:13px;cursor:pointer;font-family:var(--f);
  font-weight:800;font-size:1rem;letter-spacing:.06em;color:var(--ink);
  background:var(--amber);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.red{background:var(--red);color:#fff}
.btn.plain{background:#fff}
.row{display:flex;gap:8px}
.hint{display:flex;flex-wrap:wrap;gap:5px 14px;justify-content:center;margin-top:14px;
  font-size:.74rem;color:#8A94A2;font-weight:600}
.hint b{color:var(--ink)}
.board{list-style:none;margin:12px 0 2px;padding:0;text-align:left}
.board li{display:flex;justify-content:space-between;gap:10px;align-items:center;
  padding:9px 12px;margin-bottom:7px;border:3px solid var(--ink);border-radius:14px;
  background:#fff;font-size:.94rem;font-weight:700}
.board li.me{background:var(--amber)}
.board .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);flex:0 0 auto}
.board .who{display:flex;align-items:center;gap:9px}
.slider{display:flex;align-items:center;gap:10px;margin-top:14px}
.slider input[type=range]{flex:1;accent-color:var(--red)}
.slider span{font-size:.8rem;color:#5A6675;min-width:74px;text-align:right}

/* ---------- Touch ---------- */
#touch{position:fixed;inset:auto 0 0 0;z-index:12;display:none;
  padding:0 16px max(20px,env(safe-area-inset-bottom));justify-content:space-between;align-items:flex-end}
#touch.on{display:flex}
.pad{display:flex;gap:10px}
.key{width:66px;height:66px;border-radius:20px;border:3px solid var(--ink);background:rgba(255,248,236,.9);
  color:var(--ink);display:grid;place-items:center;font-size:1.2rem;font-weight:800;
  box-shadow:0 4px 0 rgba(23,32,43,.45)}
.key:active{transform:translateY(3px);box-shadow:none}
.key.jump{background:var(--green)}
.key.duck{background:var(--blue)}
.divider{display:flex;align-items:center;gap:10px;margin:18px 0 2px;color:#8A94A2;
  font-size:.68rem;letter-spacing:.18em;text-transform:uppercase}
.divider::before,.divider::after{content:"";flex:1;height:2px;background:#E2E7EC}
.bigcode{font-weight:800;font-size:2.8rem;letter-spacing:.34em;color:var(--ink);
  background:var(--amber);border:3px solid var(--ink);border-radius:16px;
  padding:8px 0 8px 16px;margin:4px 0 2px}
.note{margin-top:10px;font-size:.74rem;color:#8A94A2;font-weight:600;min-height:1.1em}
.swatches{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 4px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);cursor:pointer;
  position:relative;box-shadow:0 3px 0 rgba(23,32,43,.35);transition:transform .12s}
.sw:active{transform:translateY(2px)}
.sw.sel{box-shadow:0 0 0 3px var(--cream),0 0 0 6px var(--ink);transform:scale(1.1)}
.sw.taken{opacity:.28;cursor:not-allowed;box-shadow:none}
.sw.taken::after{content:"";position:absolute;left:4px;right:4px;top:14px;height:3px;
  background:var(--ink);transform:rotate(-45deg)}
#swipehint{position:fixed;left:50%;bottom:34%;transform:translateX(-50%);z-index:11;
  font-size:.8rem;color:rgba(255,248,236,.75);pointer-events:none}
</style>
</head>
<body>
<div id="app"></div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div class="bar"><i id="progress"></i><span class="flag">⚡</span></div>
  <div class="pips" id="pips"></div>
  <div class="stats">
    <span>PLACE <b id="place">1st</b></span>
    <span>DIST <b id="dist">0m</b></span>
    <span>SPEED <b id="lvl">×1</b></span>
    <span>ALIVE <b id="alive">1</b></span>
  </div>
</div>

<div id="big" class="hidden"><span>3</span></div>
<div id="toast" class="hidden"></div>
<div id="swipehint" class="hidden">swipe ◀ ▶ ▲ ▼</div>

<div id="touch">
  <div class="pad">
    <div class="key" data-k="left">◀</div>
    <div class="key" data-k="right">▶</div>
  </div>
  <div class="pad">
    <div class="key duck" data-k="duck">▼</div>
    <div class="key jump" data-k="jump">▲</div>
  </div>
</div>

<!-- Menü -->
<div class="overlay" id="menu">
  <div class="card">
    <h1>LAST <span>RUNNER</span></h1>
    <p class="sub">Everyone runs side by side. The course comes at you — dodge, jump, duck. Last one standing wins.</p>

    <label for="nm">Your name</label>
    <input id="nm" maxlength="10" placeholder="RUNNER" autocomplete="off" spellcheck="false">

    <label for="code">Room code</label>
    <input id="code" maxlength="4" placeholder="ABCD" autocomplete="off" spellcheck="false">
    <div class="row">
      <button class="btn plain" id="btn-host">Create room</button>
      <button class="btn red" id="btn-join">Join</button>
    </div>

    <div class="divider"><span>or practise</span></div>
    <button class="btn" id="btn-play">Solo run</button>

    <p class="note" id="net-note"></p>
    <div class="hint">
      <span><b>A D</b> / <b>◀ ▶</b> switch lane</span>
      <span><b>W</b> / <b>Space</b> jump</span>
      <span><b>S</b> duck</span>
    </div>
  </div>
</div>

<!-- Lobby -->
<div class="overlay hidden" id="lobby">
  <div class="card">
    <p class="sub" style="margin-bottom:2px">Share this code</p>
    <div class="bigcode" id="lobby-code">----</div>
    <p class="sub" style="margin:14px 0 2px">Pick your colour</p>
    <div class="swatches" id="swatches"></div>
    <ul class="board" id="lobby-list"></ul>
    <button class="btn red" id="btn-start">Start race</button>
    <button class="btn plain" id="btn-leave">Leave room</button>
    <p class="note" id="lobby-note">—</p>
  </div>
</div>

<!-- Ergebnis -->
<div class="overlay hidden" id="results">
  <div class="card">
    <h1 id="res-title">FINISH</h1>
    <p class="sub" id="res-sub">—</p>
    <ul class="board" id="board"></ul>
    <button class="btn red" id="btn-again">Race again</button>
    <button class="btn plain" id="btn-menu">Back to menu</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js"></script>
<script>
(function () {
"use strict";

/* ============================================================
   LAST RUNNER — 3D-Parkourrennen
   Alle Läufer sind auf derselben Höhe. Die Strecke kommt auf sie zu.
   Wer ein Hindernis trifft, scheidet aus. Der Letzte gewinnt.
   ============================================================ */

/* ---------------- Konstanten ---------------- */

const LANES = [-4.6, -2.3, 0, 2.3, 4.6];
const TRACK_HALF = 6.4;
const SPAWN_Z = -230;          // hier tauchen Hindernisse auf
const DESPAWN_Z = 14;          // hier werden sie eingesammelt

const SPEED_START = 42.8;      // entspricht der alten Stufe 5 — davor war es zäh
const SPEED_STEP = 4.2;        // Zuwachs pro Stufe
const STEP_SEC = 25;           // alle 25 Sekunden eine Stufe
const SPEED_MAX = 96;          // irgendwann ist Schluss
const LEVEL_OFFSET = 0;        // Anzeige beginnt bei ×1, das Tempo trotzdem hoch
const METER_SCALE = 3;         // Anzeigemeter — die Zahl soll ruhiger laufen

const JUMP_V = 12.2;
const GRAVITY = 37;
const DUCK_SCALE = 0.42;
const LANE_SNAP = 7.5;         // wie schnell die Spur gewechselt wird

/* ---- Zweiter Akt: Erdbeben, Rettung, Flug, Landung ----
   Alle Grenzen in Welteinheiten. Anzeigemeter = Einheiten / 3. */
const ACT = {
  QUAKE:     12000,   // 4000 m — der Boden beginnt zu beben
  QUAKE_END: 12360,   // 4120 m — die Welt bricht weg
  FLY_START: 12660,   // 4220 m — vom Flugzeug aufgefangen
  FLY_END:   18000,   // 6000 m — Landeanflug
  LAND_END:  18330,   // 6110 m — weiter zu Fuss
  BEAM:      21000,   // 7000 m — das UFO taucht auf und zieht alle hoch
  BEAM_END:  21420,   // 7140 m — abgesetzt über dem Lavaplaneten
  DROP_END:  21840    // 7280 m — im Gleiter, ab hier bleibt es so
};
const COUNTDOWN_MS = 3300;     // Dauer des Countdowns
const BANDS = [2.2, 5.0, 7.8];      // drei Flughöhen
const BAND_SNAP = 9.5;         // wie schnell zwischen die Flughöhen gewechselt wird

function phaseAt(d) {
  if (d < ACT.QUAKE) return 'ground';
  if (d < ACT.QUAKE_END) return 'quake';
  if (d < ACT.FLY_START) return 'fall';
  if (d < ACT.FLY_END) return 'fly';
  if (d < ACT.LAND_END) return 'land';
  if (d < ACT.BEAM) return 'ground';
  if (d < ACT.BEAM_END) return 'beam';
  if (d < ACT.DROP_END) return 'drop';
  return 'glide';                     // Lavaplanet — ab hier bleibt es dabei
}

/** Im Gleiter gelten dieselben Regeln wie zu Fuss — nur die Optik ist anders. */
function isFootLike(ph) { return ph === 'ground' || ph === 'glide'; }

const BIOME_LENGTH = 1500;     // Regenbogen liegt damit bei rund 1000 Anzeigemetern
const REACT_MIN = 1.02;        // Sekunden zwischen zwei Hindernissen (Stufe 0)
const REACT_MAX = 1.34;
const REACT_FLOOR = 0.58;      // so eng wird es höchstens
const PLAN_BATCH = 40;         // so viele Hindernisse werden im Voraus geplant

/* Strecke und Tempo werden aus der Rennzeit BERECHNET, nie aufsummiert.
   Nur so sehen alle Spieler exakt dieselbe Strecke, egal wie schnell ihr
   Rechner zeichnet. Das Tempo springt alle 30 Sekunden eine Stufe hoch. */

function levelAtTime(t) { return Math.floor(Math.max(0, t) / STEP_SEC); }

function speedAtTime(t) {
  return Math.min(SPEED_MAX, SPEED_START + levelAtTime(t) * SPEED_STEP);
}

function distanceAtTime(t) {
  if (t <= 0) return 0;
  const n = levelAtTime(t);
  let d = 0;
  for (let i = 0; i < n; i++) {
    d += Math.min(SPEED_MAX, SPEED_START + i * SPEED_STEP) * STEP_SEC;
  }
  return d + speedAtTime(t) * (t - n * STEP_SEC);
}

/** Umkehrung: wie lange dauert es bis zu dieser Strecke? */
function timeForDistance(d) {
  let t = 0, acc = 0, i = 0;
  for (; i < 400; i++) {
    const v = Math.min(SPEED_MAX, SPEED_START + i * SPEED_STEP);
    const seg = v * STEP_SEC;
    if (acc + seg >= d) return t + (d - acc) / v;
    acc += seg; t += STEP_SEC;
  }
  return t;
}

/* Kräftige Grundfarben. Reines Schwarz und Weiss sind leicht abgetönt,
   damit die Figur in jeder Welt noch Kontur hat. */
const COLORS = [
  0x2B3038,   // schwarz
  0xF7F9FC,   // weiss
  0xE4322F,   // rot
  0xFF8C1A,   // orange
  0xFFD93D,   // gelb
  0x3FBF57,   // grün
  0x2F7FF0,   // blau
  0x22C9D8,   // türkis
  0x8B4BE0,   // violett
  0xFF5FA8,   // pink
  0x9BE02F,   // limette
  0x8B5E3C    // braun
];

/* Vier Welten, die während des Rennens ineinander übergehen. */
const BIOMES = [
  { name: 'CITY',   sky: 0x67C8F0, fog: 0x8FD8F5, ground: 0xF2F5F7, rail: 0xD8DFE6,
    props: [0xBFD3E2, 0xA9C2D6, 0xD3E2EE, 0x93B2CB], propScale: [1.0, 1.0, 1.0] },
  { name: 'DESERT', sky: 0xFFC98A, fog: 0xFFD9A8, ground: 0xF0DCB4, rail: 0xD9BF8E,
    props: [0xE0A96A, 0xC98F52, 0xEFC48C, 0xB77C46], propScale: [1.5, 0.45, 1.5] },
  { name: 'RAINBOW', rainbow: true,
    sky: 0xFF66CC, fog: 0xFFB3E6, ground: 0xFFE8FA, rail: 0xFF88DD,
    props: [0xFF6B9D, 0xFFD166, 0x6BE7FF, 0x9B6BFF], propScale: [1.0, 1.25, 1.0] },
  { name: 'WHITEOUT', whiteout: true,
    sky: 0xFFFFFF, fog: 0xFFFFFF, ground: 0xFFFFFF, rail: 0xF0FBFF,
    props: [0xFFFFFF, 0xF6FDFF, 0xFFFFFF, 0xEDFAFF], propScale: [1.0, 1.15, 1.0] },
  { name: 'ICE',    sky: 0xBFEAF7, fog: 0xDCF3FB, ground: 0xE8F6FB, rail: 0xB6DCEA,
    props: [0x9FD8EC, 0xC7EBF6, 0x7FC2DC, 0xE3F6FC], propScale: [0.55, 1.55, 0.55] },
  { name: 'NEON',   sky: 0x1B1038, fog: 0x2A1B55, ground: 0x2A2350, rail: 0x6C4BD6,
    props: [0x53308F, 0x7A4BC4, 0x3B2470, 0x9C63FF], propScale: [0.8, 1.35, 0.8] },
  { name: 'VOID',   sky: 0x08060F, fog: 0x14102A, ground: 0x1A1730, rail: 0x4A3F7A,
    props: [0x241E47, 0x1A1636, 0x312a5c, 0x0F0C22], propScale: [0.7, 1.6, 0.7] },
  { name: 'NIGHT',  night: true,
    sky: 0x03050B, fog: 0x070A12, ground: 0x0E141F, rail: 0x1E2838,
    props: [0x0B1119, 0x080D14, 0x0E141D, 0x060A10], propScale: [1.0, 1.45, 1.0] },
  { name: 'JUNGLE', sky: 0x8FE0A8, fog: 0xBFF0CC, ground: 0xDDF0DC, rail: 0x8FC49A,
    props: [0x3F9457, 0x2E7A46, 0x58B06C, 0x246038], propScale: [1.15, 1.3, 1.15] },
  { name: 'SUNSET', sky: 0xFF9E6B, fog: 0xFFC0A0, ground: 0xF7D9C4, rail: 0xE0A783,
    props: [0xC9748A, 0xE0906B, 0xA85F80, 0xF0A98C], propScale: [0.9, 1.2, 0.9] }
];
let biomeIndex = 0, biomeMix = 0, whiteoutOn = false, nightOn = false;
let phase2 = 'ground', clouds = [], quakeShake = 0, actAnnounced = {};
let ufo = null, lavaOn = false, volcanoes = [];
let syncTimer = null, syncBest = Infinity;

const NAMES = ['ZIPPY','BOLT','NOVA','PIXEL','TOAST','RUMBLE','ECHO','WASABI',
               'JELLY','CACTUS','MOCHI','FLINT','WOBBLE','SPARK'];

/* ---------------- Zustand ---------------- */

let scene, camera, renderer, clock;
let runners = [], obstacles = [], groundTiles = [], props = [], propMats = [];
let tunnelRings = [], streaks = [], pulse = null;
let me = null;
let state = 'menu';            // menu | countdown | running | over
let speed = SPEED_START;
let travelled = 0;
let rng = null;
let results = [];
let shake = 0;
let raceTime = 0, lastLevel = -1, raceStartMs = 0, prevTravelled = 0;
let lastFrameMs = 0, hiddenAt = 0;
/* Zwei getrennte Schwellen, weil die Signale unterschiedlich sicher sind:
   - Tab im Hintergrund ist eindeutig  -> schon ab 0.9 s
   - eine Lücke zwischen zwei Bildern kann auch ein einzelner Ruckler auf einem
     schwachen Rechner sein -> erst ab 2.5 s, sonst fliegt jemand grundlos raus */
const AWAY_HIDDEN_MS = 900;
const AWAY_FREEZE_MS = 2500;
let plannedObstacles = [];     // vorab aus dem Seed berechnet
let nextPlanIndex = 0;
let isNet = false;             // echtes Mehrspielerrennen?
let lastSend = 0;
let myIndex = 0, soloColor = 0;

const keys = { up: false, down: false };
const $ = id => document.getElementById(id);

/* ---------------- Zufall mit Seed ---------------- */

function makeRng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---------------- Ton ---------------- */

let actx = null;
function beep(type, freq, dur, vol) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain(), n = actx.currentTime;
    o.type = type; o.frequency.setValueAtTime(freq, n);
    o.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.55), n + dur);
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(n + dur + 0.02);
  } catch (e) { /* egal */ }
}
const sfx = {
  jump:  () => beep('square', 460, 0.10, 0.05),
  land:  () => beep('sine', 180, 0.07, 0.04),
  duck:  () => beep('sawtooth', 240, 0.09, 0.035),
  swap:  () => beep('triangle', 620, 0.06, 0.035),
  out:   () => beep('sawtooth', 220, 0.35, 0.07),
  win:   () => { [523, 659, 784, 1047].forEach((f, i) =>
                   setTimeout(() => beep('triangle', f, 0.26, 0.06), i * 110)); },
  count: n => beep('triangle', 480 + n * 70, 0.12, 0.06),
  go:    () => { [660, 880, 1320].forEach((f, i) =>
                   setTimeout(() => beep('square', f, 0.15, 0.06), i * 70)); }
};

/* ---------------- Szene ---------------- */

function initScene() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x67C8F0);
  scene.fog = new THREE.Fog(0x8FD8F5, 60, 210);

  camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 400);
  camera.position.set(0, 5.4, 10.5);
  camera.lookAt(0, 1.8, -12);

  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  $('app').appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xEAF8FF, 0x3A5A72, 0.95));
  const sun = new THREE.DirectionalLight(0xFFF4DC, 0.85);
  sun.position.set(-18, 30, 12);

  clock = new THREE.Clock();

function onResize() {

/* ---------------- Läuferfigur ---------------- */

function makeRunner(name, color, isMe) {
  const g = new THREE.Group();
  const mat = new THREE.MeshLambertMaterial({ color });
  const dark = new THREE.MeshLambertMaterial({ color: new THREE.Color(color).multiplyScalar(0.72) });

  // Kopf
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.52, 18, 14), mat);
  head.position.y = 2.42;
  g.add(head);

  // Rumpf
  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.98, 1.15, 0.62), mat);
  torso.position.y = 1.42;
  g.add(torso);

  // Arme
  const armGeo = new THREE.BoxGeometry(0.28, 0.92, 0.28);
  const armL = new THREE.Mesh(armGeo, mat);
  const armR = new THREE.Mesh(armGeo, mat);
  armL.position.set(-0.66, 1.55, 0); armL.geometry.translate(0, -0.42, 0);
  armR.position.set(0.66, 1.55, 0);
  armR.geometry = armGeo.clone(); armR.geometry.translate(0, -0.42, 0);
  g.add(armL, armR);

  // Beine
  const legGeo = new THREE.BoxGeometry(0.34, 0.95, 0.34);
  legGeo.translate(0, -0.46, 0);
  const legL = new THREE.Mesh(legGeo, dark);
  const legR = new THREE.Mesh(legGeo.clone(), dark);
  legL.position.set(-0.26, 0.86, 0);
  legR.position.set(0.26, 0.86, 0);
  g.add(legL, legR);

  // Schatten als flache Scheibe — billiger als echte Schatten
  const shadow = new THREE.Mesh(
    new THREE.CircleGeometry(0.62, 16),
    new THREE.MeshBasicMaterial({ color: 0x0A2436, transparent: true, opacity: 0.28 })
  );
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = 0.02;
  g.add(shadow);

  // Flugzeug — im zweiten Akt fängt es die Figur auf
  const plane = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.75, 3.4), mat);
  const wing = new THREE.Mesh(new THREE.BoxGeometry(5.4, 0.18, 1.05), mat);
  wing.position.z = 0.1;
  const tailW = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.15, 0.6), mat);
  tailW.position.set(0, 0.15, 1.5);
  const fin = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.95, 0.8), mat);
  fin.position.set(0, 0.7, 1.5);
  const nose = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.1, 0.7, 10), dark);
  nose.rotation.x = Math.PI / 2;
  nose.position.z = -1.9;
  const prop = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.12, 0.1),
    new THREE.MeshBasicMaterial({ color: 0xE8EEF5, transparent: true, opacity: 0.55 }));
  prop.position.z = -2.2;
  const canopy = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.42, 1.1), dark);
  canopy.position.set(0, 0.52, -0.2);
  plane.add(body, wing, tailW, fin, nose, prop, canopy);
  plane.visible = false;
  plane.userData.prop = prop;
  scene.add(plane);

  // Gleiter für den Lavaplaneten — Rumpf liegt tief, die Figur steht darauf
  const glider = new THREE.Group();
  const hull = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.55, 4.2), mat);
  hull.position.y = -0.05;
  const nose2 = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.62, 1.3, 8), mat);
  nose2.rotation.x = Math.PI / 2;
  nose2.position.set(0, -0.05, -2.4);
  const skirt = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.22, 3.6), dark);
  skirt.position.y = -0.42;
  const engines = [];
  [-1, 1].forEach(sd => {
    const eng = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 2.6, 10), mat);
    eng.rotation.x = Math.PI / 2;
    eng.position.set(sd * 1.25, 0.05, -0.5);
    glider.add(eng);
    const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.46, 0.46, 0.22, 10), dark);
    ring.rotation.x = Math.PI / 2;
    ring.position.set(sd * 1.25, 0.05, -1.85);
    glider.add(ring);
    // Schubglühen nach hinten
    const glow = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.05, 1.4, 8),
      new THREE.MeshBasicMaterial({ color: 0xFFB13D, transparent: true, opacity: 0.7 }));
    glow.rotation.x = -Math.PI / 2;
    glow.position.set(sd * 1.25, 0.05, 1.6);
    glider.add(glow);
    engines.push(glow);

  const fins = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.14, 0.9), dark);

  const r = {
    group: g, mat, dark, head, torso, armL, armR, legL, legR, shadow,
    plane, glider, flying: false, gliding: false, planeRoll: 0, band: 1,
    name, color, isMe: !!isMe,
    lane: 2, laneX: 0, targetX: 0,
    y: 0, vy: 0, ducking: false, duckUntil: 0, duckHeld: false, duckSince: 0,
    alive: true, outAt: 0, rank: 0, phase: Math.random() * 6.28,
    // Botsteuerung
    plan: null, reaction: 0.16 + Math.random() * 0.14, skill: 0.86 + Math.random() * 0.12
  };
  scene.add(g);
  return r;
}

function updateRunnerVisual(r, dt, t) {
  const g = r.group;
  // Schatten gehört zur Figur zu Fuss — bei Flugzeug und Gleiter aus, danach wieder an
  if (r.alive) r.shadow.visible = !((r.plane && r.plane.visible) || (r.glider && r.glider.visible));

  // Gleiter schwebt unter der Figur und neigt sich in die Kurve
  if (r.glider && r.glider.visible) {
    r.glider.position.set(r.laneX, r.y - 0.15, r.group.position.z + 0.3);
    const dr = r.targetX - r.laneX;
    r.planeRoll += (-dr * 0.16 - r.planeRoll) * Math.min(1, dt * 7);
    r.glider.rotation.z = r.planeRoll;
    r.glider.position.y += Math.sin(t * 7 + r.phase) * 0.06;      // leichtes Wippen
    if (r.glider.userData.engines) {
      const f = 0.55 + 0.45 * Math.abs(Math.sin(t * 12 + r.phase));
      r.glider.userData.engines.forEach(g => { g.material.opacity = f * 0.8; });
    }
    r.shadow.visible = false;
  }

  // Flugzeug folgt der Spur und neigt sich in die Kurve
  if (r.plane && r.plane.visible) {
    r.laneX += (r.targetX - r.laneX) * Math.min(1, dt * LANE_SNAP);
    r.plane.position.set(r.laneX, r.y, r.group.position.z - 0.4);
    const drift2 = r.targetX - r.laneX;
    r.planeRoll += (-drift2 * 0.22 - r.planeRoll) * Math.min(1, dt * 6);
    r.plane.rotation.z = r.planeRoll;
    r.plane.rotation.x = r.alive ? 0 : 0.6;
    if (r.plane.userData.prop) r.plane.userData.prop.rotation.z += dt * 40;
    r.shadow.visible = false;
  }

  // Spurwechsel weich
  r.laneX += (r.targetX - r.laneX) * Math.min(1, dt * LANE_SNAP);
  g.position.x = r.laneX;
  g.position.y = r.y;

  // Neigung beim Wechseln
  const drift = (r.targetX - r.laneX);
  g.rotation.z = THREE.MathUtils.clamp(-drift * 0.09, -0.3, 0.3);
  g.rotation.y = THREE.MathUtils.clamp(-drift * 0.12, -0.4, 0.4);

  const airborne = r.y > 0.05;

  if (!r.alive) {
    if (r.fellIn) {
      g.position.y -= dt * 16;                     // stürzt in die Grube
      g.rotation.x += dt * 2.0;
    } else {
      g.rotation.x += dt * 3.2;
      g.position.z += dt * 26;                     // wird zurückgeworfen
    }
    r.shadow.visible = false;
    return;
  }

  // Ducken staucht die Figur
  const targetScaleY = r.ducking ? DUCK_SCALE : 1;
  g.scale.y += (targetScaleY - g.scale.y) * Math.min(1, dt * 16);
  g.scale.x = g.scale.z = 1 + (1 - g.scale.y) * 0.4;

  // Lauf- und Sprungpose
  const sw = Math.sin(t * 13 + r.phase);
  if (airborne) {
    r.legL.rotation.x = -0.9; r.legR.rotation.x = 0.5;
    r.armL.rotation.x = -2.2; r.armR.rotation.x = -1.6;
  } else if (r.ducking) {
    r.legL.rotation.x = -1.2; r.legR.rotation.x = -0.4;
    r.armL.rotation.x = -0.4; r.armR.rotation.x = 0.4;
  } else {
    r.legL.rotation.x = sw * 0.95;
    r.legR.rotation.x = -sw * 0.95;
    r.armL.rotation.x = -sw * 0.85;
    r.armR.rotation.x = sw * 0.85;
    r.torso.position.y = 1.42 + Math.abs(sw) * 0.05;
  }

  r.shadow.position.y = -r.y + 0.02;
  r.shadow.scale.setScalar(Math.max(0.3, 1 - r.y * 0.14));
  r.shadow.material.opacity = Math.max(0.05, 0.28 - r.y * 0.035);
}

let groundMat = null, edgeMat = null;

function buildTrack() {
  groundMat = new THREE.MeshLambertMaterial({ color: 0xF2F5F7 });
  edgeMat = new THREE.MeshLambertMaterial({ color: 0xD8DFE6 });

  const TILE_LEN = 10;
  for (let i = 0; i < 26; i++) {
    const tile = new THREE.Group();
    const slab = new THREE.Mesh(new THREE.BoxGeometry(TRACK_HALF * 2, 1, TILE_LEN), groundMat);
    slab.position.y = -0.5;
    tile.add(slab);
    tile.userData.slab = slab;
    tile.userData.rails = [];

    // Randleisten
    [-1, 1].forEach(s => {
      const rail = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, TILE_LEN), edgeMat);
      rail.position.set(s * TRACK_HALF, 0.24, 0);
      tile.add(rail);
      tile.userData.rails.push(rail);
    });

    // Fugen als Orientierung
    const seam = new THREE.Mesh(new THREE.BoxGeometry(TRACK_HALF * 2, 0.06, 0.4),
      new THREE.MeshBasicMaterial({ color: 0xC7D2DB }));
    seam.position.set(0, 0.02, -TILE_LEN / 2);
    tile.add(seam);
    tile.userData.seam = seam;

    // Stützpfeiler, die nur auf der Brücke sichtbar werden
    const pier = new THREE.Mesh(new THREE.BoxGeometry(1.6, 26, 1.6),
      new THREE.MeshLambertMaterial({ color: 0x8FA0AE }));
    pier.position.set(0, -14, 0);
    pier.visible = false;
    tile.add(pier);
    tile.userData.pier = pier;

    tile.position.z = -i * TILE_LEN;
    scene.add(tile);
    groundTiles.push(tile);
  }

  // Häuser links und rechts
  propMats = [0xBFD3E2, 0xA9C2D6, 0xD3E2EE, 0x93B2CB].map(c =>
    new THREE.MeshLambertMaterial({ color: c }));
  for (let i = 0; i < 26; i++) {
    const sd = i % 2 ? 1 : -1;
    const h = 12 + Math.random() * 34;
    const bw = 7 + Math.random() * 5;
    const b = new THREE.Mesh(
      new THREE.BoxGeometry(bw, h, 9 + Math.random() * 7),
      propMats[i % propMats.length]);
    b.position.set(sd * (TRACK_HALF + 7 + Math.random() * 5), h / 2 - 1,
      -i * 18 - Math.random() * 10);
    b.userData.baseY = h / 2 - 1;
    b.userData.wobble = 0.85 + Math.random() * 0.3;
    b.userData.side = sd;                 // links oder rechts
    b.userData.halfW = bw / 2;            // halbe Grundbreite
    b.userData.baseX = Math.abs(b.position.x);

    // Beleuchtete Fenster auf der zur Bahn zeigenden Seite — nur nachts sichtbar.
    // Sie hängen am Haus, wandern und skalieren also automatisch mit.
    b.userData.windows = [];
    const rows = Math.max(2, Math.floor(h / 6));
    for (let ry = 0; ry < rows; ry++) {
      for (let cx = -1; cx <= 1; cx++) {
        if (Math.random() < 0.42) continue;          // nicht jedes Fenster brennt
        const warm = Math.random() < 0.75;
        const win = new THREE.Mesh(
          new THREE.BoxGeometry(0.12, 0.85, 1.5),
          new THREE.MeshBasicMaterial({ color: warm ? 0xFFD98A : 0x9FD4FF }));
        win.position.set(-sd * (bw / 2 + 0.06),
          -h / 2 + 3.5 + ry * 5.5,
          cx * 2.6);
        win.visible = false;
        b.add(win);
        b.userData.windows.push(win);
      }
    }
    scene.add(b);
    props.push(b);
  }

}

/* ---------------- Tunnel ---------------- */

const TUNNEL_EVERY = 2400;     // alle so viele Einheiten
const TUNNEL_LEN = 620;        // so lang ist er
const RING_GAP = 13;
const RING_COUNT = 22;

/** Liegt diese Streckenstelle in einem Tunnel? */
const TUNNEL_OFFSET = 900;     // die ersten Meter bleiben offen

function inTunnel(d) {
  if (d >= ACT.BEAM) return false;          // auf dem Lavaplaneten gibt es keine Tunnel
  const m = (((d - TUNNEL_OFFSET) % TUNNEL_EVERY) + TUNNEL_EVERY) % TUNNEL_EVERY;
  return m < TUNNEL_LEN;
}

/** Wie tief drin? 0 am Rand, 1 in der Mitte — für weiche Übergänge. */
function tunnelDepth(d) {
  const m = (((d - TUNNEL_OFFSET) % TUNNEL_EVERY) + TUNNEL_EVERY) % TUNNEL_EVERY;
  if (m >= TUNNEL_LEN) return 0;
  const edge = 70;
  return Math.min(1, Math.min(m, TUNNEL_LEN - m) / edge);
}

function buildTunnel() {
  const wallMat = new THREE.MeshLambertMaterial({ color: 0x3A4657 });
  const trimMat = new THREE.MeshLambertMaterial({ color: 0x222B38 });
  const lampMat = new THREE.MeshBasicMaterial({ color: 0xFFE9A8, transparent: true, opacity: 1 });

  for (let i = 0; i < RING_COUNT; i++) {
    const g = new THREE.Group();
    // Seitenwände
    [-1, 1].forEach(sd => {
      const w = new THREE.Mesh(new THREE.BoxGeometry(1.4, 11, RING_GAP * 0.92), wallMat);
      w.position.set(sd * (TRACK_HALF + 0.7), 4.6, 0);
      g.add(w);
      const t = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.7, RING_GAP * 0.92), trimMat);
      t.position.set(sd * (TRACK_HALF + 0.7), 9.9, 0);
      g.add(t);
    });
    // Decke
    const c = new THREE.Mesh(new THREE.BoxGeometry(TRACK_HALF * 2 + 3.2, 1.2, RING_GAP * 0.92), wallMat);
    c.position.y = 10.4;
    g.add(c);
    // Deckenlampe
    const lamp = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.28, 0.9), lampMat.clone());
    lamp.position.y = 9.7;
    g.add(lamp);
    g.userData.lamp = lamp;

    g.visible = false;
    g.position.z = -i * RING_GAP;
    scene.add(g);
    tunnelRings.push(g);
  }
}

function updateTunnel(dt, t) {
  const span = RING_GAP * RING_COUNT;
  tunnelRings.forEach(g => {
    g.position.z += speed * dt;
    if (g.position.z > 18) g.position.z -= span;
    const worldDist = travelled - g.position.z;
    g.visible = inTunnel(worldDist);
    if (g.visible && g.userData.lamp) {
      // Lampen flackern leicht, damit der Tunnel lebt
      const f = 0.55 + 0.45 * Math.abs(Math.sin(worldDist * 0.9));
      g.userData.lamp.material.opacity = f;
    }
  });

  // Drinnen wird es dunkel und eng
  const depth = tunnelDepth(travelled);
  if (depth > 0) {
    scene.fog.color.lerp(_c1.setHex(0x1A2230), depth * 0.85);
    scene.background.lerp(_c1.setHex(0x121A26), depth * 0.9);
    scene.fog.far = 210 - depth * 70;
    camera.fov = (58 + Math.min(10, lastLevel * 1.1)) - depth * 5;
    camera.updateProjectionMatrix();
  } else if (scene.fog.far !== 210) {
    scene.fog.far = 210;
  }
  if (depth > 0.05 && !tunnelAnnounced) { tunnelAnnounced = true; showToast('TUNNEL'); }
  if (depth === 0) tunnelAnnounced = false;

  if (inBridge(travelled) && !bridgeAnnounced) { bridgeAnnounced = true; showToast('NO RAILS'); }
  if (!inBridge(travelled)) bridgeAnnounced = false;
  if (Math.abs(bankAngle(travelled)) > 0.05 && !bankAnnounced) { bankAnnounced = true; showToast('TILT'); }
  if (Math.abs(bankAngle(travelled)) < 0.01) bankAnnounced = false;
}

let tunnelAnnounced = false, bridgeAnnounced = false, bankAnnounced = false;

/* ---------------- Weissraum ---------------- */

/** Färbt ein Hindernis weiss — dunkle Kanten bleiben, damit die Form lesbar ist. */
function whiteObstacle(o, on) {
  if (!o.group || o.whited === on) return;
  o.whited = on;
  o.group.traverse(m => {
    if (!m.material || !m.material.color) return;
    const c = m.material;
    if (c.userData === undefined) c.userData = {};
    if (c.userData.orig === undefined) c.userData.orig = c.color.getHex();
    const orig = c.userData.orig;
    // Luminanz: alles Dunkle bleibt dunkel, der Rest wird weiss
    const lum = ((orig >> 16 & 255) * 0.3 + (orig >> 8 & 255) * 0.59 + (orig & 255) * 0.11) / 255;
    if (lum < 0.28) return;
    c.color.setHex(on ? 0xFFFFFF : orig);
  });
}

/** Blendet die Bodenwelt aus und die Wolkenwelt ein — je nach Phase. */
function updateAct(dt, t) {
  const ph = phaseAt(travelled);
  const flyish = (ph === 'fall' || ph === 'fly' || ph === 'land');

  // Ankündigungen
  if (ph !== phase2) {
    phase2 = ph;
    if (ph === 'quake') { showToast('EARTHQUAKE'); beep('sawtooth', 90, 1.4, 0.06); }
    if (ph === 'fly') { showToast('AIRBORNE'); sfx.win(); }
    if (ph === 'land') { showToast('LANDING'); }
    if (ph === 'ground' && travelled > ACT.LAND_END - 10 && travelled < ACT.BEAM) showToast('BACK ON FOOT');
    if (ph === 'beam') { showToast('ABDUCTED'); beep('sine', 900, 1.2, 0.05); }
    if (ph === 'drop') { showToast('LAVA WORLD'); beep('sawtooth', 110, 1.0, 0.06); }
    if (ph === 'glide') { showToast('SPEEDER'); sfx.win(); }
  }

  // ---- Dritter Akt: UFO, Absetzen, Lavaplanet ----
  const lavaPhase = (ph === 'drop' || ph === 'glide');
  if (lavaOn !== lavaPhase) {
    lavaOn = lavaPhase;
    if (lavaPhase) { whiteoutOn = false; nightOn = false; }
    props.forEach(pr => {
      pr.visible = !lavaPhase;
      if (pr.userData.windows) pr.userData.windows.forEach(w => { w.visible = false; });
    });
    volcanoes.forEach(v => { v.visible = lavaPhase; });
  }
  if (lavaOn) {
    // Vulkane folgen den Plätzen der Häuser und rauchen
    volcanoes.forEach((v, i) => {
      const pr = props[i];
      if (!pr) return;
      v.position.set(pr.userData.side * Math.max(pr.userData.baseX, 15), 0, pr.position.z);
      if (v.userData.smoke) {
        v.userData.smoke.position.y = v.userData.baseH + 3.5 + Math.sin(t * 1.4 + i) * 0.8;
        v.userData.smoke.material.opacity = 0.35 + 0.2 * Math.sin(t * 0.9 + i);
      }
    });
  }

  if (ph === 'beam') {
    const b = (travelled - ACT.BEAM) / (ACT.BEAM_END - ACT.BEAM);
    ufo.visible = true;
    ufo.position.set(0, 34 - b * 16, -34 + b * 30);
    ufo.rotation.y += dt * 0.6;
    if (ufo.userData.beam) ufo.userData.beam.material.opacity = 0.15 + b * 0.35;
    quakeShake = 0.1 + b * 0.25;
  } else if (ph === 'drop') {
    ufo.visible = false;
    quakeShake = 0;
  } else if (ph !== 'glide') {
    ufo.visible = false;
  }

  // Beben: Boden sackt und kippt, Häuser stürzen
  if (ph === 'quake') {
    const q = (travelled - ACT.QUAKE) / (ACT.QUAKE_END - ACT.QUAKE);
    quakeShake = 0.15 + q * 0.9;
    groundTiles.forEach((tile, i) => {
      tile.position.y = -q * q * 6 * (0.6 + (i % 4) * 0.25);
      tile.rotation.z = Math.sin(i * 1.7) * q * 0.16;
    });
    props.forEach((pr, i) => {
      pr.rotation.z = Math.sin(i * 2.3) * q * 0.5;
      pr.position.y = pr.userData.baseY * pr.scale.y - q * q * 14;
    });
  } else {
    quakeShake = 0;
  }

  // Sturz und Flug: Bodenwelt weg, Wolken her
  const hideGround = (ph === 'fall' || ph === 'fly');
  groundTiles.forEach(tile => { tile.visible = !hideGround; });
  props.forEach(pr => { pr.visible = !hideGround; });
  tunnelRings.forEach(g => { if (hideGround) g.visible = false; });

  if (flyish) {
    clouds.forEach(g => {
      g.visible = true;
      g.position.z += speed * dt * 0.75;
      if (g.position.z > 24) { g.position.z -= 20 * clouds.length; }
    });
    scene.background.setHex(0x9BD4F5);
    scene.fog.color.setHex(0xCDE7FA);
    scene.fog.far = 240;
  } else {
    clouds.forEach(g => { g.visible = false; });
  }

  // Boden nach der Landung wieder aufrichten
  if (ph === 'ground' && travelled > ACT.LAND_END) {
    groundTiles.forEach(tile => { tile.position.y = 0; tile.rotation.z = 0; });
    props.forEach(pr => { pr.rotation.z = 0; });
  }
}

/** Höhe und Zustand der eigenen Figur in Sturz, Flug und Landung. */
function updateActRunner(r, dt) {
  const ph = phaseAt(travelled);

  if (ph === 'fall') {
    const f = (travelled - ACT.QUAKE_END) / (ACT.FLY_START - ACT.QUAKE_END);
    r.flying = false;
    if (f < 0.55) {
      r.y = -(f / 0.55) * (f / 0.55) * 24;             // freier Fall
      r.plane.visible = false;
    } else {
      const t2 = (f - 0.55) / 0.45;
      const e = 1 - Math.pow(1 - t2, 3);
      r.y = -24 + (BANDS[1] + 24) * e;                  // das Flugzeug fängt ihn auf
      r.plane.visible = true;
      if (t2 > 0.25) r.group.visible = false;
    }
    return true;
  }

  if (ph === 'fly') {
    if (!r.flying) { r.band = 1; }        // Einstieg immer auf mittlerer Höhe
    r.flying = true;
    r.plane.visible = true;
    r.group.visible = false;
    return true;
  }

  if (ph === 'beam') {
    // Nach oben ins UFO gezogen
    const b = (travelled - ACT.BEAM) / (ACT.BEAM_END - ACT.BEAM);
    const e = b * b;
    r.flying = false; r.gliding = false;
    r.y = e * 26;
    r.group.visible = b < 0.92;
    r.group.scale.setScalar(Math.max(0.15, 1 - e * 0.85));
    r.group.rotation.y += dt * 3.4;
    r.plane.visible = false;
    r.glider.visible = false;
    return true;
  }

  if (ph === 'drop') {
    // Auf den Lavaplaneten abgesetzt, der Gleiter fängt einen auf
    const f = (travelled - ACT.BEAM_END) / (ACT.DROP_END - ACT.BEAM_END);
    r.flying = false;
    r.group.visible = true;
    r.group.scale.setScalar(1);
    r.group.rotation.y = 0;
    r.y = f < 0.6 ? 26 * (1 - Math.pow(f / 0.6, 1.7)) : 0;
    r.glider.visible = f > 0.35;
    r.gliding = true;
    return true;
  }

  if (ph === 'glide') {
    // Ab hier läuft alles wie zu Fuss — nur eben im Gleiter
    r.flying = false;
    r.gliding = true;
    r.glider.visible = true;
    r.group.visible = true;
    r.group.scale.setScalar(1);
    r.plane.visible = false;
    return false;
  }

  if (ph === 'land') {
    const f = (travelled - ACT.FLY_END) / (ACT.LAND_END - ACT.FLY_END);
    r.flying = false;
    r.y = Math.max(0, r.y * (1 - f) - f * 0.2);
    r.plane.visible = f < 0.75;
    r.group.visible = f >= 0.6;
    if (f >= 0.99) { r.y = 0; r.vy = 0; }
    return true;
  }

  r.flying = false;
  r.gliding = false;
  r.plane.visible = false;
  if (r.glider) r.glider.visible = false;
  r.group.visible = true;
  return false;
}

/* ---------------- Kulisse auf Abstand halten ---------------- */

/* Die Biome skalieren die Häuser in der Breite. Ohne Korrektur ragen sie
   dadurch in die Fahrbahn — in der Wüste bis auf 3.05, die Bahn geht bis 6.4.
   Also wird die Position jedes Hauses aus seiner AKTUELLEN Breite berechnet. */
function updateProps() {
  props.forEach(pr => {
    const u = pr.userData;
    if (u.halfW === undefined) return;
    const halfNow = u.halfW * pr.scale.x;
    const worldDist = travelled - pr.position.z;
    // Im Tunnel müssen sie hinter die Tunnelwand, sonst nur neben die Bahn
    const clearance = inTunnel(worldDist) ? 9.6 : TRACK_HALF + 1.4;
    const minX = clearance + halfNow;
    pr.position.x = u.side * Math.max(u.baseX, minX);
  });
}

/* ---------------- Brücke ohne Geländer ---------------- */

const BRIDGE_EVERY = 3100, BRIDGE_LEN = 480, BRIDGE_OFFSET = 2000;
const BRIDGE_HALF = 3.5;       // nur noch die mittleren drei Spuren tragen

function inBridge(d) {
  if (inTunnel(d)) return false;                 // nie beides gleichzeitig
  const m = (((d - BRIDGE_OFFSET) % BRIDGE_EVERY) + BRIDGE_EVERY) % BRIDGE_EVERY;
  return m < BRIDGE_LEN;
}

function updateBridge() {
  const narrow = BRIDGE_HALF / TRACK_HALF;
  groundTiles.forEach(tile => {
    const worldDist = travelled - tile.position.z;
    const on = inBridge(worldDist);
    const slab = tile.userData.slab;
    if (!slab) return;

    // Kein weiches Nachziehen: jede Kachel ist entweder breit oder schmal.
    // Bei 10 Einheiten Kachellänge sieht die Kante wie eine Brückenfuge aus.
    const f = on ? narrow : 1;
    slab.scale.x = f;
    if (tile.userData.seam) tile.userData.seam.scale.x = f;

    const halfNow = TRACK_HALF * f;
    tile.userData.rails.forEach((r, i) => {
      r.position.x = (i ? 1 : -1) * halfNow;
      r.visible = !on;                            // auf der Brücke fehlt das Geländer
    });
    if (tile.userData.pier) tile.userData.pier.visible = on;
  });
}

/* ---------------- Schräglage ---------------- */

const BANK_EVERY = 2700, BANK_LEN = 520, BANK_OFFSET = 1500;

function bankAngle(d) {
  const m = (((d - BANK_OFFSET) % BANK_EVERY) + BANK_EVERY) % BANK_EVERY;
  if (m >= BANK_LEN) return 0;
  const fade = Math.min(1, Math.min(m, BANK_LEN - m) / 90);
  return Math.sin(m * 0.012) * 0.26 * fade;       // sanftes Kippen nach links und rechts
}

/* ---------------- Gewitter im VOID ---------------- */

let boltT = 0, boltNext = 2.4;

function updateStorm(dt) {
  const inVoid = BIOMES[biomeIndex] && BIOMES[biomeIndex].name === 'VOID';
  if (!inVoid) { boltT = 0; return; }
  boltT += dt;
  if (boltT > boltNext) {
    boltT = 0;
    boltNext = 1.6 + Math.random() * 3.2;
    // Doppelblitz, dann Donner
    scene.background.setHex(0xC8D4FF);
    setTimeout(() => { if (state === 'running') scene.background.setHex(0x6B7BB8); }, 60);
    setTimeout(() => { if (state === 'running') scene.background.setHex(0xC8D4FF); }, 130);
    beep('sawtooth', 70, 0.9, 0.05);
  }
}

/* ---------------- Effekte ---------------- */

/** Lichtstreifen, die bei hohem Tempo vorbeiziehen. */
function buildStreaks() {
  const mat = new THREE.MeshBasicMaterial({ color: 0xFFFFFF, transparent: true, opacity: 0 });
  for (let i = 0; i < 26; i++) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.16, 6 + Math.random() * 10), mat.clone());
    m.position.set((Math.random() - 0.5) * 26, 1 + Math.random() * 12, -Math.random() * 200);
    scene.add(m);
    streaks.push(m);
  }
}

function updateStreaks(dt) {
  const rush = Math.max(0, Math.min(1, (speed - 45) / 45));
  streaks.forEach(m => {
    m.position.z += (speed * 1.9) * dt;
    if (m.position.z > 16) {
      m.position.z = -180 - Math.random() * 60;
      m.position.x = (Math.random() - 0.5) * 26;
      m.position.y = 1 + Math.random() * 12;
    }
    m.material.opacity = rush * 0.4;
  });
}

/** Druckwelle beim Tempowechsel. */
function firePulse() {
  if (!pulse) {
    pulse = new THREE.Mesh(
      new THREE.RingGeometry(2.4, 3.2, 40),
      new THREE.MeshBasicMaterial({ color: 0xFFFFFF, transparent: true,
        opacity: 0, side: THREE.DoubleSide }));
    scene.add(pulse);
  }
  pulse.position.set(0, 3, -70);
  pulse.scale.setScalar(0.6);
  pulse.material.opacity = 0.9;
}

function updatePulse(dt) {
  if (!pulse || pulse.material.opacity <= 0) return;
  pulse.position.z += (speed * 2.6) * dt;
  pulse.scale.multiplyScalar(1 + dt * 2.6);
  pulse.material.opacity -= dt * 1.1;
  if (pulse.position.z > 12) pulse.material.opacity = 0;
}

/* ---------------- Biome ---------------- */

const _c1 = new THREE.Color(), _c2 = new THREE.Color(), _cm = new THREE.Color();

function lerpHex(a, b, t) {
  _c1.setHex(a); _c2.setHex(b);
  return _cm.copy(_c1).lerp(_c2, t);
}

/** Setzt Himmel, Nebel, Boden und Kulisse je nach Fortschritt. */
function applyBiome(progress) {
  // Auf dem Lavaplaneten gilt nur noch eine Welt
  if (lavaOn) {
    const pulseL = 0.5 + 0.5 * Math.sin(travelled * 0.05);
    scene.background.setHex(0x2A0B08);
    scene.fog.color.setHex(0x4A1A0C);
    scene.fog.far = 200;
    if (groundMat) groundMat.color.setHex(0x1C1310);
    if (edgeMat) edgeMat.color.setRGB(1, 0.35 + pulseL * 0.25, 0.08);
    return;
  }

  const total = BIOMES.length;
  const pos = progress * total;
  const i = Math.min(total - 1, Math.floor(pos));
  const j = Math.min(total - 1, i + 1);
  const t = Math.min(1, Math.max(0, (pos - i) * 2 - 0.6));   // scharfer, kurzer Übergang

  const A = BIOMES[i], B = BIOMES[j];

  // Nacht: fast alles verschwindet, nur die Fenster der Häuser glimmen.
  const nt = (A.night && t < 0.5) || (B.night && t >= 0.5);
  if (nt !== nightOn) {
    nightOn = nt;
    props.forEach(pr => {
      if (pr.userData.windows) pr.userData.windows.forEach(w => { w.visible = nt; });
    });
    if (nt && state === 'running') showToast('NIGHT');
  }

  // Weissraum: Himmel, Boden, Kulisse — alles gleisst. Nur die dunklen
  // Kanten der Hindernisse bleiben, sonst wäre nichts mehr zu erkennen.
  const wo = (A.whiteout && t < 0.5) || (B.whiteout && t >= 0.5);
  if (wo !== whiteoutOn) {
    whiteoutOn = wo;
    if (wo && state === 'running') { showToast('WHITEOUT'); if (pulse) firePulse(); }
  }
  if (wo) {
    const shimmer = 0.93 + 0.07 * Math.sin(travelled * 0.06);
    scene.background.setRGB(shimmer, shimmer, 1);
    scene.fog.color.setRGB(1, 1, 1);
    if (groundMat) groundMat.color.setRGB(1, 1, 1);
    if (edgeMat) edgeMat.color.setRGB(0.92, 0.99, 1);
    propMats.forEach(m => m.color.setRGB(1, 1, 1));
    props.forEach(pr => {
      const w = pr.userData.wobble;
      pr.scale.set(w, 1.15, w);
      pr.position.y = pr.userData.baseY * 1.15;
    });
    if (i !== biomeIndex) { biomeIndex = i; }
    return;
  }

  // Regenbogenwelt: alles kreist durch den Farbkreis
  if ((A.rainbow && t < 0.5) || (B.rainbow && t >= 0.5)) {
    const hue = (travelled * 0.0016) % 1;
    scene.background.setHSL(hue, 0.85, 0.62);
    scene.fog.color.setHSL((hue + 0.08) % 1, 0.8, 0.78);
    if (groundMat) groundMat.color.setHSL((hue + 0.5) % 1, 0.55, 0.85);
    if (edgeMat) edgeMat.color.setHSL((hue + 0.33) % 1, 0.9, 0.62);
    propMats.forEach((m, k) => m.color.setHSL((hue + k * 0.17) % 1, 0.85, 0.6));
    const sc2 = [1.0, 1.25, 1.0];
    props.forEach(pr => {
      const w = pr.userData.wobble;
      pr.scale.set(sc2[0] * w, sc2[1], sc2[2] * w);
      pr.position.y = pr.userData.baseY * sc2[1];
    });
    if (i !== biomeIndex) { biomeIndex = i; if (state === 'running') showToast('RAINBOW'); }
    return;
  }

  scene.background.copy(lerpHex(A.sky, B.sky, t));
  scene.fog.color.copy(lerpHex(A.fog, B.fog, t));
  if (groundMat) groundMat.color.copy(lerpHex(A.ground, B.ground, t));
  if (edgeMat) edgeMat.color.copy(lerpHex(A.rail, B.rail, t));
  propMats.forEach((m, k) => m.color.copy(lerpHex(A.props[k % 4], B.props[k % 4], t)));

  // Kulisse formt sich um: Wüstenfelsen breit und flach, Eiszacken hoch und schmal
  const sc = [0, 1, 2].map(k => A.propScale[k] + (B.propScale[k] - A.propScale[k]) * t);
  props.forEach(pr => {
    const w = pr.userData.wobble;
    pr.scale.set(sc[0] * w, sc[1], sc[2] * w);
    pr.position.y = pr.userData.baseY * sc[1];
  });

  if (i !== biomeIndex) {
    biomeIndex = i;
    if (state === 'running') showToast(BIOMES[i].name);
  }
}

/* ---------------- Hindernisse ---------------- */

/* Vier Bauarten, alle eindeutig lesbar:
     gate  — Wand mit Lücke  -> in die freie Spur wechseln
     low   — flache Hürde     -> springen
     high  — Balken oben      -> ducken
     block — einzelne Kiste   -> ausweichen oder springen  */

/* Erst planen, dann bauen. Der Plan hängt nur am Seed und ist damit
   auf allen Rechnern identisch — es muss keine Weltinfo übertragen werden. */
let planRng = null, planDist = 0;

/** Welche Bauarten sind auf dieser Stufe erlaubt? */
function kindsForLevel(lvl) {
  const k = ['gate', 'low', 'high', 'block', 'narrow'];
  if (lvl >= 1) k.push('pit', 'mover', 'laser');   // Grube, wandernde Kiste, Laser
  if (lvl >= 2) k.push('boulder');        // Felsbrocken rollt entgegen
  if (lvl >= 2) k.push('sandwich');       // ducken, sofort springen
  if (lvl >= 3) k.push('gatelow');        // Spur wechseln UND springen
  if (lvl >= 4) k.push('zigzag');         // zwei Tore direkt hintereinander
  if (lvl >= 5) k.push('gatehigh');       // Spur wechseln UND ducken
  if (lvl >= 6) k.push('slalom', 'chain');// Serien
  // Ab Stufe 8 kommen die harten Sachen doppelt so oft
  if (lvl >= 8) k.push('zigzag', 'chain', 'sandwich', 'gatelow', 'gatehigh');
  return k;
}

/** Abstand in Sekunden — wird mit steigender Stufe enger, aber nie unfair. */
function gapSecondsFor(lvl, r) {
  const tighten = Math.min(REACT_MIN - REACT_FLOOR, lvl * 0.048);
  const lo = REACT_MIN - tighten;
  const hi = REACT_MAX - tighten;
  return lo + r() * (hi - lo);
}

let planLastKind = null;

/** Mindestabstand NACH einem Hindernis — sonst entstehen unlösbare Folgen.
    Wer springt, ist 0.66s in der Luft und kann sich in der Zeit nicht ducken. */
function minGapAfter(kind) {
  if (kind === 'low' || kind === 'pit' || kind === 'gatelow') return 0.88;
  if (kind === 'high' || kind === 'gatehigh') return 0.44;
  return 0.38;
}

function startPlan(seed) {
  planRng = makeRng(seed);
  planDist = 110;                      // die ersten Meter bleiben frei
  planLastKind = null;
  plannedObstacles = [];
  extendPlan();
}

/** Rückt den Planzeiger weiter und achtet dabei auf den Mindestabstand. */
function advance(seconds, prevKind) {
  const t = timeForDistance(planDist);
  planDist += speedAtTime(t) * Math.max(seconds, minGapAfter(prevKind));
}

/** Hängt weitere Hindernisse an. Immer in derselben Reihenfolge — dadurch
    sehen alle Spieler dieselbe Strecke, egal wann ihr Rechner nachplant. */
function extendPlan() {
  const r = planRng;
  for (let n = 0; n < PLAN_BATCH; n++) {
    const ph = phaseAt(planDist);
    // Während Beben, Sturz und Landung wird nichts gebaut
    if (ph === 'quake' || ph === 'fall') { planDist = ACT.FLY_START + 90; planLastKind = null; continue; }
    if (ph === 'beam' || ph === 'drop') { planDist = ACT.DROP_END + 140; planLastKind = null; continue; }
    if (ph === 'land') { planDist = ACT.LAND_END + 120; planLastKind = null; continue; }

    const tHere = timeForDistance(planDist);
    const lvl = levelAtTime(tHere);

    if (ph === 'fly') {
      const airKinds = lvl >= 5 ? ['cloudgate', 'cloudgate', 'debris', 'stormbar']
                                : ['cloudgate', 'cloudgate', 'debris'];
      const ak = airKinds[Math.floor(r() * airKinds.length)];
      pushAir(ak, planDist, r, lvl);
      planDist += speedAtTime(tHere) * (0.95 + r() * 0.45);
      planLastKind = 'air';
      continue;
    }

    // Auf dem Lavaplaneten kommen drei eigene Bauarten dazu
    if (ph === 'glide' && r() < 0.42) {
      const lavaKinds = ['geyser', 'lavaflow', 'rockfall'];
      const lk = lavaKinds[Math.floor(r() * lavaKinds.length)];
      pushLava(lk, planDist, r, lvl);
      advance(gapSecondsFor(lvl, r) + (lk === 'lavaflow' ? 0.5 : 0.15),
              lk === 'lavaflow' ? 'low' : 'block');
      planLastKind = lk;
      continue;
    }

    const kinds = kindsForLevel(lvl);
    const kind = kinds[Math.floor(r() * kinds.length)];
    let last = kind;

    if (kind === 'sandwich') {
      // Erst ducken, dann springen — nie umgekehrt, sonst hängt man in der Luft
      pushObstacle('high', planDist, r, lvl);
      advance(0.55, 'high');
      pushObstacle('low', planDist, r, lvl);
      last = 'low';

    } else if (kind === 'zigzag') {
      const a = pushObstacle('narrow', planDist, r, lvl);
      advance(0.62, 'gate');
      const b = pushObstacle('narrow', planDist, r, lvl);
      const pool = inBridge(planDist) ? [1, 2, 3] : [0, 1, 2, 3, 4];
      const far = pool[(pool.indexOf(a.open[0]) + 2 + Math.floor(r() * 2)) % pool.length];
      b.open = [far]; b.safeLanes = [far];
      last = 'gate';

    } else if (kind === 'chain') {
      // Reihenfolge fest: ducken, ausweichen, springen. Der Sprung kommt zuletzt,
      // damit danach kein Hindernis folgt, das man am Boden lösen müsste.
      pushObstacle('high', planDist, r, lvl);
      advance(0.50, 'high');
      pushObstacle('block', planDist, r, lvl);
      advance(0.46, 'block');
      pushObstacle('low', planDist, r, lvl);
      last = 'low';

    } else if (kind === 'slalom') {
      const sPool = inBridge(planDist) ? [1, 2, 3] : [0, 1, 2, 3, 4];
      let li = Math.floor(r() * sPool.length);
      for (let i = 0; i < 3; i++) {
        const lane = sPool[li];
        const o = pushObstacle('block', planDist, r, lvl);
        o.used = [lane];
        o.safeLanes = [];
        sPool.forEach(k => { if (k !== lane) o.safeLanes.push(k); });
        li = (li + (r() < 0.5 ? 1 : 2)) % sPool.length;
        if (i < 2) advance(0.46, 'block');
      }
      last = 'block';

    } else {
      pushObstacle(kind, planDist, r, lvl);
    }

    const extra = (kind === 'boulder') ? 0.35 : 0;
    advance(gapSecondsFor(lvl, r) + extra, last);
    planLastKind = last;
  }
}

/** Hindernisse im Flug: Wolkenwand mit Loch, Trümmer, Gewitterband. */
function pushAir(kind, dist, r, lvl) {
  const o = { dist, kind, air: true, safeLanes: [], boxes: [], built: false, lvl, zHalf: 1.6 };
  const cells = [];                       // [lane, band] die blockiert sind

  if (kind === 'cloudgate') {
    // Alles zu ausser ein bis zwei Zellen — da muss man durch
    const openCount = lvl >= 6 ? 1 : (r() < 0.4 ? 2 : 1);
    const open = [];
    while (open.length < openCount) {
      const key = Math.floor(r() * 5) * 3 + Math.floor(r() * 3);
      if (open.indexOf(key) < 0) open.push(key);
    }
    for (let l = 0; l < 5; l++) for (let b = 0; b < 3; b++) {
      if (open.indexOf(l * 3 + b) < 0) cells.push([l, b]);
    }
    o.open = open;

  } else if (kind === 'debris') {
    const n = 3 + Math.floor(r() * 3);
    while (cells.length < n) {
      const l = Math.floor(r() * 5), b = Math.floor(r() * 3);
      if (!cells.some(c => c[0] === l && c[1] === b)) cells.push([l, b]);
    }
    o.rocks = true;

  } else {                                 // stormbar
    const band = Math.floor(r() * 3);
    for (let l = 0; l < 5; l++) cells.push([l, band]);
    o.storm = true;
    o.band = band;
  }

  o.cells = cells;
  cells.forEach(c => {
    o.boxes.push({ x: LANES[c[0]], w: 2.15, yMin: BANDS[c[1]] - 1.4, yMax: BANDS[c[1]] + 1.4 });
  });
  plannedObstacles.push(o);
  return o;
}

/* Drei Bauarten, die es nur auf dem Lavaplaneten gibt. */
function pushLava(kind, dist, r, lvl) {
  const o = { dist, kind, lava: true, safeLanes: [], boxes: [], built: false, lvl, zHalf: 1.8 };

  if (kind === 'geyser') {
    // Zwei Gruppen von Fontänen, die sich abwechseln. Man muss in der Spur sein,
    // deren Fontäne gerade schläft — das ist reines Timing, kein Auswendiglernen.
    // Auf der Brücke dürfen nur die tragenden Spuren mitspielen, und beide
    // Gruppen müssen dort mindestens eine Spur haben — sonst gibt es keinen Ausweg.
    const pool = inBridge(dist) ? [1, 2, 3] : [0, 1, 2, 3, 4];
    let A = pool.filter(() => r() < 0.5);
    let B = pool.filter(l => A.indexOf(l) < 0);
    if (!A.length || !B.length) {          // beide Gruppen müssen besetzt sein
      A = [pool[0]];
      B = pool.slice(1);
    }
    o.groupA = A; o.groupB = B;
    o.phase = r() * 6.28;
    o.rate = 0.055 + r() * 0.02;
    pool.forEach(l => o.boxes.push({ x: LANES[l], w: 2.0, yMin: 900, yMax: 901, lane: l }));
    o.safeLanes = pool.slice();            // je nach Takt ist mal die eine, mal die andere frei

  } else if (kind === 'lavaflow') {
    // Glühender Strom quer über die Bahn — drüberspringen
    o.safeLanes = [0, 1, 2, 3, 4];
    o.zHalf = Math.max(2.6, speedAtTime(timeForDistance(dist)) * 0.13);
    o.boxes.push({ x: 0, w: TRACK_HALF * 2, yMin: -0.3, yMax: 0.5 });

  } else {                       // rockfall
    // Brocken stürzen aus dem Himmel und schlagen genau vor einem ein
    const pool = inBridge(dist) ? [1, 2, 3] : [0, 1, 2, 3, 4];
    const n = 1 + (r() < 0.45 ? 1 : 0);
    const used = [];
    for (let k = 0; k < n; k++) {
      let l = pool[Math.floor(r() * pool.length)];
      let guard = 0;
      while (used.indexOf(l) >= 0 && guard++ < 8) l = pool[(pool.indexOf(l) + 1) % pool.length];
      used.push(l);
    }
    o.used = used;
    o.fall = true;
    pool.forEach(l => { if (used.indexOf(l) < 0) o.safeLanes.push(l); });
    used.forEach(l => o.boxes.push({ x: LANES[l], w: 2.1, yMin: 0, yMax: 2.3 }));
  }

  plannedObstacles.push(o);
  return o;
}

function pushObstacle(kind, dist, r, lvl) {
  const o = { dist, kind, safeLanes: [], boxes: [], built: false, lvl };
  if (kind === 'pit') o.kind = 'pit';

  if (kind === 'gate' || kind === 'narrow') {
    const openCount = kind === 'narrow' ? 1 : (r() < 0.28 ? 2 : 1);
    // Auf der Brücke tragen nur die mittleren drei Spuren — die Lücke muss dort liegen
    const pool = inBridge(dist) ? [1, 2, 3] : [0, 1, 2, 3, 4];
    const open = [];
    while (open.length < openCount) {
      const l = pool[Math.floor(r() * pool.length)];
      if (open.indexOf(l) < 0) open.push(l);
    }
    o.kind = 'gate';
    o.open = open;
    o.safeLanes = open.slice();

  } else if (kind === 'block' || kind === 'mover') {
    // Auf der Brücke tragen nur die Spuren 1–3. Höchstens zwei davon blockieren,
    // sonst bliebe kein sicherer Ausweg.
    const pool = inBridge(dist) ? [1, 2, 3] : [0, 1, 2, 3, 4];
    const n = kind === 'mover' ? 1 : (r() < 0.4 ? Math.min(2, pool.length - 1) : 1);
    const used = [];
    for (let k = 0; k < n; k++) {
      let l = pool[Math.floor(r() * pool.length)];
      let guard = 0;
      while (used.indexOf(l) >= 0 && guard++ < 8) l = pool[(pool.indexOf(l) + 1) % pool.length];
      used.push(l);
    }
    o.kind = 'block';
    o.used = used;
    LANES.forEach((x, i) => { if (used.indexOf(i) < 0) o.safeLanes.push(i); });
    if (kind === 'mover') {
      o.mover = true;
      o.moveRange = 1 + Math.floor(r() * 2);      // um wie viele Spuren es pendelt
      o.movePhase = r() * 6.28;
      o.moveSpeed = 0.8 + r() * 0.5;
    }

  } else if (kind === 'laser') {
    // Waagrechter Strahl, der auf und ab fährt. Man entscheidet erst spät,
    // ob man drüber springt oder drunter durchrutscht.
    o.safeLanes = [0, 1, 2, 3, 4];
    o.laserPhase = r() * 6.28;
    o.laserSpeed = 0.9 + r() * 0.6;
    o.zHalf = 1.1;

  } else if (kind === 'boulder') {
    // Rollt schneller als die Strecke — kommt also entgegen.
    o.boulder = true;
    o.approach = 0.35;
    o.dist = dist + Math.abs(SPAWN_Z) * o.approach / (1 + o.approach);   // Vorlauf
    const pool = inBridge(o.dist) ? [1, 2, 3] : [0, 1, 2, 3, 4];
    const n = r() < 0.3 ? Math.min(2, pool.length - 1) : 1;
    const used = [];
    for (let k = 0; k < n; k++) {
      let l = pool[Math.floor(r() * pool.length)];
      let guard = 0;
      while (used.indexOf(l) >= 0 && guard++ < 8) l = pool[(pool.indexOf(l) + 1) % pool.length];
      used.push(l);
    }
    o.used = used;
    LANES.forEach((x, i) => { if (used.indexOf(i) < 0) o.safeLanes.push(i); });
    o.spin = 0;
    o.zHalf = 2.0;

  } else if (kind === 'pit') {
    o.safeLanes = [0, 1, 2, 3, 4];
    // Länge wächst mit dem Tempo — der Sprung muss sitzen
    o.zHalf = Math.max(3.0, speedAtTime(timeForDistance(dist)) * 0.17);

  } else if (kind === 'gatelow' || kind === 'gatehigh') {
    // Auf der Brücke tragen nur die mittleren Spuren — die Lücke MUSS dort liegen,
    // sonst müsste man dorthin, wo gar kein Boden mehr ist.
    const pool = inBridge(dist) ? [1, 2, 3] : [0, 1, 2, 3, 4];
    o.kind = 'gate';
    o.open = [pool[Math.floor(r() * pool.length)]];
    o.safeLanes = o.open.slice();
    o.extra = (kind === 'gatelow') ? 'low' : 'high';

  } else {
    o.safeLanes = [0, 1, 2, 3, 4];
  }

  if (o.zHalf === undefined) o.zHalf = 1.4;
  plannedObstacles.push(o);
  return o;
}

/** Baut die sichtbaren Teile eines geplanten Hindernisses. */
function buildObstacle(o) {
  const grp = new THREE.Group();
  const red = new THREE.MeshLambertMaterial({ color: 0xFF5B45 });
  const blue = new THREE.MeshLambertMaterial({ color: 0x37B7F5 });
  const yellow = new THREE.MeshLambertMaterial({ color: 0xFFC53D });
  const dark = new THREE.MeshLambertMaterial({ color: 0x2A3644 });
  // Lufthindernisse bringen ihre Trefferflächen schon aus der Planung mit —
  // die dürfen hier NICHT geleert werden, sonst fliegt man durch alles hindurch.
  if (!o.air) o.boxes = [];

  if (o.lava) {
    const rockMat = new THREE.MeshLambertMaterial({ color: 0x2A211E, flatShading: true });
    const hotMat = new THREE.MeshBasicMaterial({ color: 0xFF7A22 });
    const coreMat = new THREE.MeshBasicMaterial({ color: 0xFFD98A });

    if (o.kind === 'geyser') {
      o.jets = [];
      [].concat(o.groupA, o.groupB).forEach(l => {
        const jet = new THREE.Group();
        const col = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.95, 5.0, 10), hotMat);
        col.position.y = 2.5;
        const core = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.5, 4.6, 8), coreMat);
        core.position.y = 2.4;
        jet.add(col, core);
        jet.position.set(LANES[l], 0, 0);
        jet.scale.y = 0.001;
        grp.add(jet);
        // Krater am Boden, damit man sieht, wo es gleich losgeht
        const ring = new THREE.Mesh(new THREE.CylinderGeometry(1.15, 1.35, 0.35, 10), rockMat);
        ring.position.set(LANES[l], 0.15, 0);
        grp.add(ring);
        o.jets.push({ lane: l, mesh: jet, groupA: o.groupA.indexOf(l) >= 0 });
      });

    } else if (o.kind === 'lavaflow') {
      const len = o.zHalf * 2;
      const stream = new THREE.Mesh(new THREE.BoxGeometry(TRACK_HALF * 2 - 0.4, 0.28, len), hotMat);
      stream.position.y = 0.06;
      grp.add(stream);
      const bright = new THREE.Mesh(new THREE.BoxGeometry(TRACK_HALF * 2 - 2.4, 0.3, len * 0.55), coreMat);
      bright.position.y = 0.09;
      grp.add(bright);
      [-1, 1].forEach(sd => {
        const lip = new THREE.Mesh(new THREE.BoxGeometry(TRACK_HALF * 2, 0.5, 0.8), rockMat);
        lip.position.set(0, 0.2, sd * (o.zHalf + 0.3));
        grp.add(lip);
      });
      o.streamMat = hotMat;

    } else {                       // rockfall
      o.fallers = [];
      o.used.forEach(l => {
        const rk = new THREE.Mesh(new THREE.DodecahedronGeometry(1.15, 0), rockMat);
        rk.position.set(LANES[l], 30, 0);
        grp.add(rk);
        // Glut an der Unterseite
        const hot = new THREE.Mesh(new THREE.SphereGeometry(0.6, 8, 6), hotMat);
        hot.position.set(LANES[l], 29.4, 0);
        grp.add(hot);
        // Warnschatten am Boden
        const mark = new THREE.Mesh(new THREE.CircleGeometry(1.5, 16),
          new THREE.MeshBasicMaterial({ color: 0x120A08, transparent: true, opacity: 0.55 }));
        mark.rotation.x = -Math.PI / 2;
        mark.position.set(LANES[l], 0.05, 0);
        grp.add(mark);
        o.fallers.push({ rock: rk, hot, mark });
      });
    }

  } else if (o.air) {
    const cloudMat = new THREE.MeshLambertMaterial({ color: 0xE9F2FA });
    const rockMat = new THREE.MeshLambertMaterial({ color: 0x7C6B5C, flatShading: true });
    const stormMat = new THREE.MeshLambertMaterial({ color: 0x4A4270 });

    o.cells.forEach(c => {
      const x = LANES[c[0]], y = BANDS[c[1]];
      if (o.rocks) {
        const rk = new THREE.Mesh(new THREE.DodecahedronGeometry(1.25, 0), rockMat);
        rk.position.set(x, y, 0);
        grp.add(rk);
        o.spinners = o.spinners || [];
        o.spinners.push(rk);
      } else if (o.storm) {
        const b = new THREE.Mesh(new THREE.BoxGeometry(2.3, 2.7, 1.1), stormMat);
        b.position.set(x, y, 0);
        grp.add(b);
        const flash = new THREE.Mesh(new THREE.BoxGeometry(0.18, 2.6, 0.18),
          new THREE.MeshBasicMaterial({ color: 0xFFFFFF, transparent: true, opacity: 0.8 }));
        flash.position.set(x, y, 0.4);
        grp.add(flash);
        o.flashes = o.flashes || [];
        o.flashes.push(flash);
      } else {
        // Wolkenblock aus drei versetzten Ballen, damit es weich wirkt
        [[0, 0, 0, 1.5], [-0.7, 0.4, 0.2, 1.1], [0.75, -0.35, -0.2, 1.15]].forEach(d => {
          const puff = new THREE.Mesh(new THREE.SphereGeometry(d[3], 10, 8), cloudMat);
          puff.position.set(x + d[0], y + d[1], d[2]);
          puff.scale.set(1.15, 0.85, 0.7);
          grp.add(puff);
        });
      }
    });

    // Der freie Durchflug bekommt einen leuchtenden Rahmen
    if (o.open) {
      o.open.forEach(key => {
        const l = Math.floor(key / 3), b = key % 3;
        const ring = new THREE.Mesh(new THREE.RingGeometry(1.15, 1.42, 20),
          new THREE.MeshBasicMaterial({ color: 0xFFC53D, transparent: true,
            opacity: 0.85, side: THREE.DoubleSide }));
        ring.position.set(LANES[l], BANDS[b], 0.2);
        grp.add(ring);
      });
    }

  } else if (o.kind === 'laser') {
    // Dünner Strahl: schmal genug, dass immer entweder Springen oder Ducken passt
    const core = new THREE.Mesh(new THREE.BoxGeometry(TRACK_HALF * 2 - 1.2, 0.30, 0.30),
      new THREE.MeshBasicMaterial({ color: 0xFFFFFF }));
    const halo = new THREE.Mesh(new THREE.BoxGeometry(TRACK_HALF * 2 - 1.2, 0.62, 0.62),
      new THREE.MeshBasicMaterial({ color: 0xD070FF, transparent: true, opacity: 0.55 }));
    grp.add(core, halo);
    // Schienen an den Seiten, an denen der Strahl fährt
    [-1, 1].forEach(sd => {
      const rail = new THREE.Mesh(new THREE.BoxGeometry(0.4, 5.0, 0.4),
        new THREE.MeshLambertMaterial({ color: 0x2A3644 }));
      rail.position.set(sd * (TRACK_HALF - 0.5), 2.5, 0);
      grp.add(rail);
      const knob = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.7),
        new THREE.MeshLambertMaterial({ color: 0xD070FF }));
      knob.position.set(sd * (TRACK_HALF - 0.5), 1.6, 0);
      grp.add(knob);
      o.knobs = o.knobs || []; o.knobs.push(knob);
    });
    o.core = core; o.halo = halo;
    o.boxes.push({ x: 0, w: TRACK_HALF * 2, yMin: 1.45, yMax: 1.75 });

  } else if (o.boulder) {
    const rockMat = new THREE.MeshLambertMaterial({ color: 0x8A7B6B, flatShading: true });
    o.rocks = [];
    o.used.forEach(l => {
      const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.9, 0), rockMat);
      rock.position.set(LANES[l], 0.9, 0);
      grp.add(rock);
      // Staubfahne dahinter
      const dust = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.4, 2.4),
        new THREE.MeshBasicMaterial({ color: 0xC9B9A6, transparent: true, opacity: 0.35 }));
      dust.position.set(LANES[l], 0.22, -1.6);
      grp.add(dust);
      o.rocks.push(rock);
      o.boxes.push({ x: LANES[l], w: 1.85, yMin: 0, yMax: 1.8 });
    });

  } else if (o.kind === 'pit') {
    const len = o.zHalf * 2;
    // dunkler Schacht im Boden
    const hole = new THREE.Mesh(new THREE.BoxGeometry(TRACK_HALF * 2 - 0.6, 0.5, len),
      new THREE.MeshLambertMaterial({ color: 0x14202B }));
    hole.position.y = -0.2;
    grp.add(hole);
    [-1, 1].forEach(sd => {
      const lip = new THREE.Mesh(new THREE.BoxGeometry(TRACK_HALF * 2 - 0.6, 0.3, 0.6),
        new THREE.MeshLambertMaterial({ color: 0xFF5B45 }));
      lip.position.set(0, 0.12, sd * (o.zHalf - 0.3));
      grp.add(lip);
    });
    // Streifen im Schacht als Tiefenhinweis
    for (let i = -1; i <= 1; i++) {
      const bar = new THREE.Mesh(new THREE.BoxGeometry(TRACK_HALF * 2 - 1.2, 0.12, 0.25),
        new THREE.MeshLambertMaterial({ color: 0x2A3644 }));
      bar.position.set(0, -0.02, i * (o.zHalf * 0.5));
      grp.add(bar);
    }
    o.boxes.push({ x: 0, w: TRACK_HALF * 2, yMin: -0.4, yMax: 0.55 });

  } else if (o.kind === 'gate') {
    LANES.forEach((x, i) => {
      if (o.open.indexOf(i) >= 0) return;
      const w = new THREE.Mesh(new THREE.BoxGeometry(2.15, 4.4, 0.6), red);
      w.position.set(x, 2.2, 0); grp.add(w);
      const cap = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.32, 0.72), dark);
      cap.position.set(x, 4.5, 0); grp.add(cap);
      o.boxes.push({ x, w: 2.15, yMin: 0, yMax: 4.4 });
    });
    o.open.forEach(i => {
      const a = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1, 4), yellow);
      a.rotation.x = Math.PI;
      a.position.set(LANES[i], 5.6, 0);
      grp.add(a);
    });

    // In der Lücke steckt noch eine Hürde: Spur wechseln reicht nicht
    if (o.extra === 'low') {
      o.open.forEach(i => {
        const b = new THREE.Mesh(new THREE.BoxGeometry(2.15, 1.05, 0.72), yellow);
        b.position.set(LANES[i], 0.52, 0);
        grp.add(b);
        const st = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.2, 0.8), dark);
        st.position.set(LANES[i], 0.9, 0);
        grp.add(st);
        o.boxes.push({ x: LANES[i], w: 2.15, yMin: 0, yMax: 1.1 });
      });
    } else if (o.extra === 'high') {
      o.open.forEach(i => {
        const b = new THREE.Mesh(new THREE.BoxGeometry(2.15, 1.4, 0.72), blue);
        b.position.set(LANES[i], 2.95, 0);
        grp.add(b);
        o.boxes.push({ x: LANES[i], w: 2.15, yMin: 2.3, yMax: 4.4 });
      });
    }

  } else if (o.kind === 'low') {
    const bar = new THREE.Mesh(new THREE.BoxGeometry(TRACK_HALF * 2 - 1, 1.1, 0.7), yellow);
    bar.position.y = 0.55; grp.add(bar);
    const stripe = new THREE.Mesh(new THREE.BoxGeometry(TRACK_HALF * 2 - 1, 0.22, 0.78), dark);
    stripe.position.y = 0.95; grp.add(stripe);
    o.boxes.push({ x: 0, w: TRACK_HALF * 2, yMin: 0, yMax: 1.15 });

  } else if (o.kind === 'high') {
    const bar = new THREE.Mesh(new THREE.BoxGeometry(TRACK_HALF * 2 - 1, 1.5, 0.7), blue);
    bar.position.y = 2.85; grp.add(bar);
    [-1, 1].forEach(sd => {
      const pst = new THREE.Mesh(new THREE.BoxGeometry(0.45, 5.4, 0.45), dark);
      pst.position.set(sd * (TRACK_HALF - 0.6), 2.7, 0); grp.add(pst);
    });
    o.boxes.push({ x: 0, w: TRACK_HALF * 2, yMin: 2.25, yMax: 4.4 });

  } else {
    const bodyMat = o.mover ? new THREE.MeshLambertMaterial({ color: 0xB05BFF }) : red;
    o.meshes = [];
    o.used.forEach(l => {
      const b = new THREE.Mesh(new THREE.BoxGeometry(1.9, 1.7, 1.6), bodyMat);
      b.position.set(LANES[l], 0.85, 0); grp.add(b);
      const t = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.22, 1.7), dark);
      t.position.set(LANES[l], 1.78, 0); grp.add(t);
      o.meshes.push([b, t]);
      o.boxes.push({ x: LANES[l], w: 1.9, yMin: 0, yMax: 1.75 });
    });
    if (o.mover) {
      // Zwei Pfeile zeigen an, dass sich diese Kiste bewegt
      [-1, 1].forEach(sd => {
        const a = new THREE.Mesh(new THREE.ConeGeometry(0.32, 0.7, 4),
          new THREE.MeshLambertMaterial({ color: 0xFFC53D }));
        a.rotation.z = sd * Math.PI / 2;
        a.position.set(LANES[o.used[0]] + sd * 1.6, 2.3, 0);
        grp.add(a);
        o.meshes.push([a]);
      });
    }
  }

  o.group = grp;
  o.built = true;
  grp.position.z = SPAWN_Z;
  scene.add(grp);
  obstacles.push(o);
}

/* ---------------- Netzwerk (PeerJS) ---------------- */

const Net = {
  mode: 'offline',            // offline | host | client
  code: null,
  myId: 'solo',
  myName: 'RUNNER',
  roster: [],                 // [{id, name}]
  seed: 0,
  _peer: null,
  _conns: new Map(),          // Host: id -> Verbindung
  _host: null,                // Client: Verbindung zum Host
  _states: new Map(),         // Host: id -> letzter Zustand
  _outs: new Map(),           // Host: id -> Endstrecke
  _relay: null,

  isOnline() { return this.mode !== 'offline'; },
  isHost() { return this.mode === 'host'; },

  code4() {
    let t = '';
    for (let i = 0; i < 4; i++) t += 'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.floor(Math.random() * 24)];
    return t;
  },

  host(name) {
    this.leave();
    this.myName = name;
    if (!window.Peer) { note('PeerJS could not be loaded'); return; }
    const code = this.code4();
    this._peer = new Peer('lastrunner-' + code);
    this.mode = 'host';
    this.code = code;

    this._peer.on('open', id => {
      this.myId = id;
      this.roster = [{ id, name: this.myName, ci: 0 }];
      openLobby(code, true);
    });

    this._peer.on('connection', conn => {
      if (this._conns.size >= 11 || state === 'running' || state === 'countdown') {
        conn.on('open', () => { conn.send({ t: 'full' }); setTimeout(() => conn.close(), 400); });
        return;
      }
      this._conns.set(conn.peer, conn);
      conn.on('open', () => {
        if (!this.roster.some(r => r.id === conn.peer)) {
          this.roster.push({ id: conn.peer, name: '…', ci: this.freeColor() });
        }
        this.pushRoster();
      });
      conn.on('data', d => {
        if (!d || !d.t) return;
        if (d.t === 'hi') {
          const e = this.roster.find(r => r.id === conn.peer);
          if (e) e.name = String(d.name || '…').slice(0, 10).toUpperCase();
          this.pushRoster();
        } else if (d.t === 'ping') {
          try { conn.send({ t: 'pong', c: d.c, rt: raceTime }); } catch (e) {}
        } else if (d.t === 'color') {
          this.setColor(conn.peer, d.ci);
        } else if (d.t === 's') {
          this._states.set(conn.peer, d);
        } else if (d.t === 'out') {
          this._outs.set(conn.peer, d.dist | 0);
          const st = this._states.get(conn.peer) || {};
          st.a = 0; this._states.set(conn.peer, st);
          this.checkOver();
        }
      });
      conn.on('close', () => {
        this._conns.delete(conn.peer);
        this.roster = this.roster.filter(r => r.id !== conn.peer);
        this._states.delete(conn.peer);
        this.pushRoster();
        this.checkOver();
      });
    });

    this._peer.on('error', e => {
      note(e.type === 'unavailable-id' ? 'That code was taken — try again' : 'Error: ' + e.type);
      this.leave(); backToMenu();
    });
  },

  join(code, name) {
    this.leave();
    this.myName = name;
    if (!window.Peer) { note('PeerJS could not be loaded'); return; }
    this._peer = new Peer();
    this.mode = 'client';
    this.code = code;

    this._peer.on('open', id => {
      this.myId = id;
      this._host = this._peer.connect('lastrunner-' + code, { metadata: { name } });
      const to = setTimeout(() => {
        if (!this._host || !this._host.open) { note('Room ' + code + ' is not responding');
          this.leave(); backToMenu(); }
      }, 9000);

      this._host.on('open', () => {
        clearTimeout(to);
        this._host.send({ t: 'hi', name: this.myName });
        openLobby(code, false);
      });

      this._host.on('data', d => {
        if (!d || !d.t) return;
        if (d.t === 'pong') { applyClockSample(d.c, d.rt || 0); }
        else if (d.t === 'roster') { this.roster = d.r || []; renderLobby(); }
        else if (d.t === 'go') { this.seed = d.seed; beginRace(d.seed); }
        else if (d.t === 'w') { applyRemote(d.p || []); }
        else if (d.t === 'res') { showNetResults(d.rows || []); }
        else if (d.t === 'full') { note('That room is full or already racing'); this.leave(); backToMenu(); }
      });

      this._host.on('close', () => { note('The host closed the room'); this.leave(); backToMenu(); });
    });

    this._peer.on('error', e => {
      note(e.type === 'peer-unavailable' ? 'Room ' + code + ' not found' : 'Error: ' + e.type);
      this.leave(); backToMenu();
    });
  },

  startRound() {
    if (!this.isHost()) return null;
    this.seed = Math.floor(Math.random() * 0x7FFFFFFF);
    this._states.clear();
    this._outs.clear();
    this.broadcast({ t: 'go', seed: this.seed });
    this.startRelay();
    return this.seed;
  },

  /** Eigene Farbe wählen — Host entscheidet selbst, Clients fragen an. */
  pickColor(ci) {
    if (this.isHost()) this.setColor(this.myId, ci);
    else if (this._host && this._host.open) {
      try { this._host.send({ t: 'color', ci: ci | 0 }); } catch (e) {}
    }
  },

  /** Rennzeit beim Host abfragen. */
  ping() {
    if (this.isHost() || !this._host || !this._host.open) return;
    try { this._host.send({ t: 'ping', c: performance.now() }); } catch (e) {}
  },

  sendState(st) {
    if (this.mode === 'host') this._states.set(this.myId, st);
    else if (this._host && this._host.open) {
      try { this._host.send(Object.assign({ t: 's' }, st)); } catch (e) {}
    }
  },

  sendOut(dist) {
    if (this.mode === 'host') {
      this._outs.set(this.myId, dist | 0);
      const st = this._states.get(this.myId) || {};
      st.a = 0; this._states.set(this.myId, st);
      this.checkOver();
    } else if (this._host && this._host.open) {
      try { this._host.send({ t: 'out', dist: dist | 0 }); } catch (e) {}
    }
  },

  startRelay() {
    if (this._relay || !this.isHost()) return;
    this._relay = setInterval(() => {
      const list = [];
      this.roster.forEach((r, i) => {
        const st = this._states.get(r.id);
        if (!st) return;
        list.push({ i, l: st.l | 0, y: +(st.y || 0).toFixed(2), d: st.d ? 1 : 0, a: st.a ? 1 : 0 });
      });
      this.broadcast({ t: 'w', p: list });
      applyRemote(list);
    }, 50);
  },

  stopRelay() { if (this._relay) { clearInterval(this._relay); this._relay = null; } },

  checkOver() {
    if (!this.isHost() || state !== 'running') return;
    // Auch im Netz erst, wenn alle draussen sind — der Letzte läuft weiter.
    const total = this.roster.length;
    const outCount = this._outs.size;
    if (total - outCount > 0) return;

    const rows = this.roster.map(r => ({
      n: r.name,
      d: this._outs.has(r.id) ? this._outs.get(r.id) : Math.round(travelled / METER_SCALE),
      s: this._outs.has(r.id) ? 0 : 1
    })).sort((a, b) => (b.s - a.s) || (b.d - a.d));

    this.broadcast({ t: 'res', rows });
    this.stopRelay();
    showNetResults(rows);
  },

  /** Erster Farbindex, den noch niemand belegt. */
  freeColor(except) {
    for (let i = 0; i < COLORS.length; i++) {
      if (!this.roster.some(r => r.id !== except && r.ci === i)) return i;
    }
    return 0;
  },

  /** Farbwunsch eines Spielers umsetzen — nur wenn die Farbe frei ist. */
  setColor(id, ci) {
    if (!this.isHost()) return;
    ci = Math.max(0, Math.min(COLORS.length - 1, ci | 0));
    const e = this.roster.find(r => r.id === id);
    if (!e) return;
    const taken = this.roster.some(r => r.id !== id && r.ci === ci);
    e.ci = taken ? this.freeColor(id) : ci;
    this.pushRoster();
  },

  pushRoster() { this.broadcast({ t: 'roster', r: this.roster }); renderLobby(); },

  broadcast(m) {

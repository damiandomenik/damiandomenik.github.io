    this._conns.forEach(c => { if (c.open) { try { c.send(m); } catch (e) {} } });
  },

  leave() {
    stopClockSync();
    this.stopRelay();
    this._conns.forEach(c => { try { c.close(); } catch (e) {} });
    this._conns.clear();
    if (this._host) { try { this._host.close(); } catch (e) {} this._host = null; }
    if (this._peer) { try { this._peer.destroy(); } catch (e) {} this._peer = null; }
    this.mode = 'offline'; this.code = null; this.roster = [];
    this._states.clear(); this._outs.clear();
  }
};

window.addEventListener('beforeunload', () => Net.leave());

/* Zweiter Weg zur selben Erkennung: der Browser meldet, wenn der Tab in den
   Hintergrund geht. Das greift auch dann, wenn das Zeichnen nicht ganz stoppt. */
if (typeof document !== 'undefined' && document.addEventListener) {
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      hiddenAt = performance.now();
    } else if (hiddenAt) {
      const away = performance.now() - hiddenAt;
      hiddenAt = 0;
      if (state === 'running' && me && me.alive && away > AWAY_HIDDEN_MS) {
        eliminate(me);
        showToast('AWAY — OUT');
      }
    }
  });
}

function note(text) { $('net-note').textContent = text || ''; }

/* ---------------- Uhrensynchronisation ----------------
   Selbst mit gemeinsamem Startzeitpunkt driften die Uhren: Netzlaufzeit beim
   Startsignal, gedrosselte Tabs, ungenaue Timer. Deshalb fragt jeder Client
   regelmässig die Rennzeit des Hosts ab und zieht seine eigene nach. */

function startClockSync() {
  stopClockSync();
  const ping = () => {
    if (state !== 'running' && state !== 'countdown') return;
    Net.ping();
  };
  ping();
  syncTimer = setInterval(ping, 1500);
}

function stopClockSync() {
  if (syncTimer) { clearInterval(syncTimer); syncTimer = null; }
}

/** Antwort des Hosts verarbeiten und die eigene Uhr korrigieren. */
function applyClockSample(sentAt, hostRaceTime) {
  const now = performance.now();
  const rtt = now - sentAt;
  if (rtt > 900) return;                       // Ausreisser verwerfen
  // Nur bessere Messungen zählen — die schnellste Antwort ist die genaueste
  if (rtt > syncBest * 1.6 && syncBest !== Infinity) return;
  syncBest = Math.min(syncBest, rtt);

  // Zum Zeitpunkt der Antwort war der Host bei hostRaceTime; bis zu uns
  // verging etwa die halbe Umlaufzeit.
  const desired = now - (hostRaceTime + rtt / 2000) * 1000;
  const diff = desired - raceStartMs;

  if (Math.abs(diff) > 600) {
    raceStartMs = desired;                      // grosser Versatz: sofort angleichen
  } else {
    raceStartMs += diff * 0.25;                 // kleiner Versatz: weich nachziehen
  }
}

function openLobby(code, isHost) {
  $('menu').classList.add('hidden');
  $('lobby').classList.remove('hidden');
  $('lobby-code').textContent = code;
  $('btn-start').style.display = isHost ? '' : 'none';
  renderLobby();
}

/** Farbe eines Eintrags — gewählte Farbe, sonst der Listenplatz. */
function colorOf(entry, fallbackIndex) {
  const ci = (entry && entry.ci !== undefined) ? entry.ci : fallbackIndex;
  return COLORS[ci % COLORS.length];
}

function renderSwatches() {
  const box = $('swatches');
  if (!box) return;
  const mine = Net.roster.find(r => r.id === Net.myId);
  const myCi = mine ? mine.ci : -1;

  box.innerHTML = COLORS.map((c, i) => {
    const takenBy = Net.roster.find(r => r.ci === i && r.id !== Net.myId);
    const cls = 'sw' + (i === myCi ? ' sel' : '') + (takenBy ? ' taken' : '');
    const hex = '#' + c.toString(16).padStart(6, '0');
    const label = takenBy ? takenBy.name : 'colour ' + (i + 1);
    return '<button class="' + cls + '" data-ci="' + i + '" ' +
           'style="background:' + hex + '" aria-label="' + label + '"></button>';
  }).join('');

  box.querySelectorAll('.sw').forEach(el => {
    el.addEventListener('click', () => {
      if (el.classList.contains('taken')) return;
      soloColor = parseInt(el.dataset.ci, 10);
      Net.pickColor(soloColor);
      sfx.swap();
    });
  });
}

function renderLobby() {
  const list = Net.roster;
  $('lobby-list').innerHTML = list.map((r, i) => {
    const c = '#' + colorOf(r, i).toString(16).padStart(6, '0');
    return '<li class="' + (r.id === Net.myId ? 'me' : '') + '">' +
      '<span class="who"><span class="dot" style="background:' + c + '"></span>' +
      r.name + (r.id === Net.myId ? ' (you)' : '') + '</span>' +
      '<span>' + (i === 0 ? 'host' : '') + '</span></li>';
  }).join('');
  $('lobby-note').textContent = Net.isHost()
    ? (list.length > 1 ? list.length + ' runners ready' : 'Waiting for runners to join …')
    : 'Waiting for the host to start';
  renderSwatches();
}

/** Zustände der Mitspieler übernehmen. */
function applyRemote(list) {
  list.forEach(sn => {
    const r = runners[sn.i];
    if (!r || r.isMe) return;
    r.targetX = LANES[Math.max(0, Math.min(LANES.length - 1, sn.l))];
    r.lane = sn.l;
    r.netY = sn.y;
    r.ducking = !!sn.d;
    if (!sn.a && r.alive) eliminate(r, true);
  });
}

function showNetResults(rows) {
  state = 'over';
  stopClockSync();
  $('touch').classList.remove('on');
  Net.stopRelay();
  const winner = rows[0];
  const iWon = winner && winner.n === Net.myName;
  if (iWon) sfx.win();

  setTimeout(() => {
    $('hud').classList.add('hidden');
    $('res-title').textContent = iWon ? 'YOU WIN!' : (winner ? winner.n + ' WINS' : 'RACE OVER');
    $('res-sub').textContent = iWon ? 'Last runner standing'
      : 'You lasted ' + Math.round((me.outAt || travelled) / METER_SCALE) + ' m';
    $('board').innerHTML = rows.slice(0, 12).map((r, i) => {
      const medal = ['🥇', '🥈', '🥉'][i] || (i + 1) + '.';
      const entry = Net.roster.find(e => e.name === r.n);
      const c = '#' + colorOf(entry, i).toString(16).padStart(6, '0');
      return '<li class="' + (r.n === Net.myName ? 'me' : '') + '">' +
        '<span class="who"><span class="dot" style="background:' + c + '"></span>' +
        medal + ' ' + r.n + '</span><span>' + r.d + 'm</span></li>';
    }).join('');
    $('results').classList.remove('hidden');
  }, 1300);
}

function backToMenu() {
  state = 'menu';
  $('lobby').classList.add('hidden');
  $('results').classList.add('hidden');
  $('hud').classList.add('hidden');
  $('touch').classList.remove('on');
  $('menu').classList.remove('hidden');
}

/* ---------------- Bots ---------------- */

function botThink(r, dt) {
  // Nächstes Hindernis vor dem Läufer suchen
  let next = null;
  for (let i = 0; i < obstacles.length; i++) {
    const o = obstacles[i];
    if (o.z < -3 && (!next || o.z > next.z)) next = o;
  }
  if (!next) return;

  const timeTo = Math.abs(next.z) / speed;

  if (next !== r.plan) {
    r.plan = next;
    r.planned = false;
    r.planAt = r.reaction + rng() * 0.12;
  }

  if (!r.planned && timeTo < 1.0 - r.planAt) {
    r.planned = true;
    const blunder = rng() > r.skill;      // gelegentlich ein Fehler

    if (next.kind === 'gate' || next.kind === 'block') {
      if (next.mover && next.boxes.length) {
        // Zur Kiste die am weitesten entfernte Spur wählen
        let best = 0, bd = -1;
        LANES.forEach((x, i) => {
          const d = Math.abs(x - next.boxes[0].x);
          if (d > bd) { bd = d; best = i; }
        });
        if (!blunder) setLane(r, best);
      } else if (next.safeLanes.length && !blunder) {
        // nächstgelegene sichere Spur wählen
        let best = next.safeLanes[0], bd = 99;
        next.safeLanes.forEach(l => {
          const d = Math.abs(l - r.lane);
          if (d < bd) { bd = d; best = l; }
        });
        setLane(r, best);
        if (next.extra === 'low') r.wantJumpAt = timeTo - 0.28;
        if (next.extra === 'high') r.wantDuckAt = timeTo - 0.26;
      }
    } else if (next.kind === 'laser') {
      // Nach der Höhe des Strahls entscheiden
      const yb = next.boxes.length ? next.boxes[0].yMin : 1.6;
      if (!blunder) { if (yb > 1.6) r.wantDuckAt = timeTo - 0.22; else r.wantJumpAt = timeTo - 0.26; }
    } else if (next.boulder) {
      if (next.safeLanes.length && !blunder) {
        let best = next.safeLanes[0], bd = 99;
        next.safeLanes.forEach(l => { const d = Math.abs(l - r.lane); if (d < bd) { bd = d; best = l; } });
        setLane(r, best);
      }
    } else if (next.kind === 'low' || next.kind === 'pit') {
      if (!blunder) r.wantJumpAt = timeTo - 0.30;
    } else if (next.kind === 'high') {
      if (!blunder) r.wantDuckAt = timeTo - 0.24;
    }
  }

  // geplante Aktion auslösen
  if (r.wantJumpAt !== undefined && timeTo <= r.wantJumpAt) {
    doJump(r); r.wantJumpAt = undefined;
  }
  if (r.wantDuckAt !== undefined && timeTo <= r.wantDuckAt) {
    doDuck(r, 0.75); r.wantDuckAt = undefined;
  }
}

/* ---------------- Aktionen ---------------- */

/** Eine Flughöhe rauf oder runter. */
function setBand(r, delta) {
  if (!r.alive || !r.flying) return;
  const b = Math.max(0, Math.min(BANDS.length - 1, r.band + delta));
  if (b === r.band) return;
  r.band = b;
  if (r.isMe) sfx.swap();
}

function setLane(r, lane) {
  lane = THREE.MathUtils.clamp(lane, 0, LANES.length - 1);
  if (lane === r.lane) return;
  r.lane = lane;
  r.targetX = LANES[lane];
  if (r.isMe) sfx.swap();
}

function doJump(r) {
  if (!r.alive || r.y > 0.05) return;
  r.vy = JUMP_V;
  r.ducking = false;
  r.duckHeld = false;
  if (r.isMe) sfx.jump();
}

/* Ducken wird GEHALTEN. Ein kurzer Tipp hält trotzdem eine Mindestzeit an,
   damit man nicht mitten im Hindernis wieder aufsteht. */
const DUCK_MIN_MS = 420;

function duckStart(r) {
  if (!r.alive) return;
  r.duckHeld = true;
  if (r.ducking) return;
  r.ducking = true;
  r.duckSince = performance.now();
  if (r.y > 0.05) { r.vy = Math.min(r.vy, -6); }   // aus dem Sprung nach unten ziehen
  if (r.isMe) sfx.duck();
}

function duckStop(r) {
  r.duckHeld = false;
}

/* Für Bots: kurz ducken und automatisch wieder aufstehen. */
function doDuck(r, seconds) {
  duckStart(r);
  r.duckUntil = performance.now() + (seconds || 0.5) * 1000;
  r.duckHeld = false;
}

/* ---------------- Treffer ---------------- */

function runnerBox(r) {
  if (r.flying) {
    // Im Flug ist die Trefferfläche um die Flugzeugmitte herum
    return { x: r.laneX, w: 1.3, yMin: r.y - 0.62, yMax: r.y + 0.62 };
  }
  const h = r.ducking ? 1.02 : 2.85;
  return { x: r.laneX, w: 1.12, yMin: r.y, yMax: r.y + h };
}

function checkHit(r, o) {
  const rb = runnerBox(r);
  for (let i = 0; i < o.boxes.length; i++) {
    const b = o.boxes[i];
    const dx = Math.abs(rb.x - b.x);
    if (dx > (rb.w + b.w) / 2) continue;
    if (rb.yMax < b.yMin + 0.08) continue;
    if (rb.yMin > b.yMax - 0.08) continue;
    return true;
  }
  return false;
}

function eliminate(r, fromNet, intoPit) {
  if (!r.alive) return;
  r.alive = false;
  r.fellIn = !!intoPit;
  r.outAt = travelled;
  r.mat.color.setHex(0x9AA6B2);
  r.dark.color.setHex(0x7C8794);

  if (!isNet) {
    results.push({ name: r.name, dist: Math.round(travelled / METER_SCALE), color: r.color, me: r.isMe });
  }

  if (r.isMe) {
    sfx.out();
    shake = 0.5;
    showToast('OUT!');
    $('touch').classList.remove('on');
    if (isNet && !fromNet) Net.sendOut(Math.round(travelled / METER_SCALE));
  }
  updatePips();
  if (!isNet) checkRaceOver();
}

/* ---------------- Ablauf ---------------- */

function aliveRunners() { return runners.filter(r => r.alive); }

function checkRaceOver() {
  const alive = aliveRunners();
  if (state !== 'running') return;
  if (runners.length === 1) {          // Übungslauf: aus heisst vorbei
    if (!alive.length) finishRace(null);
    return;
  }
  // Erst wenn wirklich niemand mehr läuft. Der Letzte darf zeigen, wie weit er kommt.
  if (alive.length === 0) {
    let best = null;
    runners.forEach(r => { if (!best || r.outAt > best.outAt) best = r; });
    finishRace(best);
  } else if (alive.length === 1 && !alive[0].soloNoticed) {
    alive[0].soloNoticed = true;
    if (alive[0].isMe) showToast('LAST ONE STANDING');
  }
}

function finishRace(winner) {
  state = 'over';
  $('touch').classList.remove('on');
  if (winner && winner.isMe) sfx.win();

  setTimeout(() => {
    $('hud').classList.add('hidden');
    const won = winner && winner.isMe;
    const solo = runners.length === 1;
    if (solo) {
      $('res-title').textContent = 'RUN OVER';
      $('res-sub').textContent = Math.round((me.outAt || travelled) / METER_SCALE) + ' m  ·  speed ×' + (lastLevel + 1 + LEVEL_OFFSET);
    } else {
      $('res-title').textContent = won ? 'YOU WIN!' : (winner ? winner.name + ' WINS' : 'NOBODY LEFT');
      $('res-sub').textContent = won
        ? 'Last runner standing'
        : 'You lasted ' + Math.round((me.outAt || travelled) / METER_SCALE) + ' m';
    }

    const sorted = results.slice().reverse();     // zuletzt ausgeschieden = vorne
    $('board').innerHTML = sorted.slice(0, 8).map((r, i) => {
      const medal = ['🥇', '🥈', '🥉'][i] || (i + 1) + '.';
      const c = '#' + r.color.toString(16).padStart(6, '0');
      return '<li class="' + (r.me ? 'me' : '') + '">' +
        '<span class="who"><span class="dot" style="background:' + c + '"></span>' +
        medal + ' ' + r.name + '</span><span>' + r.dist + 'm</span></li>';
    }).join('');
    $('results').classList.remove('hidden');
  }, 1300);
}

function showBig(text, ms) {
  const b = $('big');
  b.querySelector('span').textContent = text;
  b.classList.remove('hidden');
  b.querySelector('span').style.animation = 'none';
  void b.querySelector('span').offsetWidth;
  b.querySelector('span').style.animation = '';
  if (ms) setTimeout(() => b.classList.add('hidden'), ms);
}

function showToast(text) {
  const t = $('toast');
  t.textContent = text;
  t.classList.remove('hidden');
  t.style.animation = 'none';
  void t.offsetWidth;
  t.style.animation = '';
  setTimeout(() => t.classList.add('hidden'), 800);
}

function updatePips() {
  $('pips').innerHTML = runners.map(r => {
    const c = '#' + r.color.toString(16).padStart(6, '0');
    return '<span class="pip ' + (r.alive ? '' : 'out') + '" style="background:' + c + '"></span>';
  }).join('');
  $('alive').textContent = aliveRunners().length;
}

/* ---------------- Rennen starten ---------------- */

/** Baut die Läufer auf: entweder aus der Lobby-Liste oder mit Bots. */
function beginRace(seed, botCount) {
  runners.forEach(r => { scene.remove(r.group); if (r.plane) scene.remove(r.plane); if (r.glider) scene.remove(r.glider); });
  obstacles.forEach(o => { if (o.group) scene.remove(o.group); });
  runners = []; obstacles = []; results = [];
  speed = SPEED_START; travelled = 0; raceTime = 0; shake = 0;
  nextPlanIndex = 0; biomeIndex = 0; lastLevel = -1; prevTravelled = 0; tunnelAnnounced = false; bridgeAnnounced = false; bankAnnounced = false;
  if (pulse) pulse.material.opacity = 0;
  whiteoutOn = false; camera.position.z = 10.5; camera.rotation.z = 0;
  nightOn = false; phase2 = 'ground'; quakeShake = 0; lavaOn = false;
  lastFrameMs = 0; hiddenAt = 0;
  if (ufo) ufo.visible = false;
  props.forEach(pr => {
    if (pr.userData.volcano) pr.userData.volcano.visible = false;
    pr.children.forEach(c => { if (c !== pr.userData.volcano) c.visible = true; });
  });
  clouds.forEach(g => { g.visible = false; });
  groundTiles.forEach(t2 => { t2.position.y = 0; t2.rotation.z = 0; t2.visible = true; });
  props.forEach(pr => { if (pr.userData.windows) pr.userData.windows.forEach(w => { w.visible = false; }); });
  applyBiome(0);

  isNet = Net.isOnline();
  startPlan(seed);

  if (isNet) {
    myIndex = Net.roster.findIndex(r => r.id === Net.myId);
    Net.roster.forEach((entry, i) => {
      const r = makeRunner(entry.name, colorOf(entry, i), entry.id === Net.myId);
      runners.push(r);
      if (entry.id === Net.myId) me = r;
    });
    if (Net.isHost()) Net.startRelay();
  } else {
    const myName = ($('nm').value || 'RUNNER').trim().slice(0, 10).toUpperCase() || 'RUNNER';
    me = makeRunner(myName, COLORS[soloColor % COLORS.length], true);
    runners.push(me);
  }

  // Startaufstellung — alle auf derselben Höhe, verteilt über die Spuren
  runners.forEach((r, i) => {
    r.soloNoticed = false;
    r.group.scale.setScalar(1);
    r.group.visible = true;
    r.flying = false;
    r.gliding = false;
    r.band = 1;
    if (r.plane) r.plane.visible = false;
    if (r.glider) r.glider.visible = false;
    r.group.rotation.y = 0;
    const lane = i % LANES.length;
    r.lane = lane;
    r.laneX = r.targetX = LANES[lane];
    // Alle stehen auf exakt derselben Linie. Ab dem sechsten Spieler teilen
    // sich zwei dieselbe Spur und überlagern sich dann — das ist gewollt:
    // die Trefferprüfung kennt ohnehin nur Spur und Höhe, kein Vorne oder Hinten.
    r.group.position.set(r.laneX, 0, 0);
    r.baseZ = r.group.position.z;
  });


  $('menu').classList.add('hidden');
  $('lobby').classList.add('hidden');
  $('results').classList.add('hidden');
  $('hud').classList.remove('hidden');
  updatePips();

  if (matchMedia('(pointer:coarse)').matches) {
    $('touch').classList.add('on');
    $('swipehint').classList.remove('hidden');
    setTimeout(() => $('swipehint').classList.add('hidden'), 3500);
  }

  // Der Startzeitpunkt wird SOFORT festgelegt, nicht am Ende der Countdown-Kette.
  // setTimeout wird von gedrosselten Tabs verzögert — dann startet dieser Spieler
  // Sekunden später und läuft ab da auf einer ganz anderen Streckenstelle.
  state = 'countdown';
  raceStartMs = performance.now() + COUNTDOWN_MS;
  raceTime = 0;
  syncBest = Infinity;

  let step = 0;
  const steps = ['3', '2', '1', 'GO!'];
  const tick = () => {
    showBig(steps[step], 620);
    if (steps[step] === 'GO!') sfx.go(); else sfx.count(3 - step);
    step++;
    if (step < steps.length) setTimeout(tick, 700);
  };
  tick();

  if (Net.isOnline() && !Net.isHost()) startClockSync();
}

/** Übungslauf: allein auf der Strecke, keine Gegner. */
function startSolo() {
  Net.leave();
  beginRace(Math.floor(Math.random() * 0x7FFFFFFF), 0);
}

/* ---------------- Eingabe ---------------- */

function bindInput() {
  const typing = e => e.target && e.target.tagName === 'INPUT';

  addEventListener('keydown', e => {
    if (typing(e)) return;
    if (state !== 'running' || !me.alive) return;
    switch (e.code) {
      case 'ArrowLeft': case 'KeyA':  setLane(me, me.lane - 1); e.preventDefault(); break;
      case 'ArrowRight': case 'KeyD': setLane(me, me.lane + 1); e.preventDefault(); break;
      case 'ArrowUp': case 'KeyW': case 'Space':
        keys.up = true;
        if (me.flying) setBand(me, 1); else doJump(me);
        e.preventDefault(); break;
      case 'ArrowDown': case 'KeyS':
        keys.down = true;
        if (me.flying) setBand(me, -1); else duckStart(me);
        e.preventDefault(); break;
    }
  });

  addEventListener('keyup', e => {
    if (typing(e)) return;
    if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') { keys.up = false; e.preventDefault(); }
    if (e.code === 'ArrowDown' || e.code === 'KeyS') { keys.down = false; duckStop(me); e.preventDefault(); }
  });

  // Touch-Knöpfe
  document.querySelectorAll('[data-k]').forEach(el => {
    el.addEventListener('pointerdown', ev => {
      ev.preventDefault();
      if (state !== 'running' || !me.alive) return;
      const k = el.dataset.k;
      if (k === 'left') setLane(me, me.lane - 1);
      if (k === 'right') setLane(me, me.lane + 1);
      if (k === 'jump') { keys.up = true; if (me.flying) setBand(me, 1); else doJump(me); }
      if (k === 'duck') { keys.down = true; if (me.flying) setBand(me, -1); else duckStart(me); }
    });
  });

  document.querySelectorAll('[data-k="duck"]').forEach(el => {
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev =>
      el.addEventListener(ev, e => { e.preventDefault(); keys.down = false; duckStop(me); }));
  });
  document.querySelectorAll('[data-k="jump"]').forEach(el => {
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev =>
      el.addEventListener(ev, e => { e.preventDefault(); keys.up = false; }));
  });

  // Wischgesten
  let sx = 0, sy = 0, swiping = false;
  const app = $('app');
  app.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; swiping = true; });
  app.addEventListener('pointerup', e => {
    if (!swiping) return;
    swiping = false;
    if (state !== 'running' || !me.alive) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) < 30 && Math.abs(dy) < 30) return;
    if (Math.abs(dx) > Math.abs(dy)) setLane(me, me.lane + (dx > 0 ? 1 : -1));
    else if (dy < 0) { if (me.flying) setBand(me, 1); else doJump(me); }
    else if (me.flying) setBand(me, -1);
    else { duckStart(me); setTimeout(() => duckStop(me), 520); }
  });
}

/* ---------------- Frame ---------------- */

function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.getElapsedTime();

  // Wechselt man den Tab, hält der Browser das Zeichnen an. Die Rennuhr läuft
  // aber weiter — die Strecke springt dann auf einen Schlag hunderte Meter
  // nach vorn, und alles dazwischen wurde nie gespielt. Wer so lange weg war,
  // scheidet aus. Sonst rennt man unverwundbar durch die halbe Strecke.
  const nowMs = performance.now();
  if (state === 'running' && lastFrameMs && me && me.alive) {
    if (nowMs - lastFrameMs > AWAY_FREEZE_MS) {
      eliminate(me);
      showToast('AWAY — OUT');
    }
  }
  lastFrameMs = nowMs;

  if (state === 'countdown' && performance.now() >= raceStartMs) {
    state = 'running';
  }

  if (state === 'running') {
    // Echte Uhr statt aufsummierter Frames: läuft auch weiter, wenn der Browser
    // den Tab drosselt oder minimiert. Sonst driften die Spieler auseinander.
    raceTime = (performance.now() - raceStartMs) / 1000;
    speed = speedAtTime(raceTime);
    const lastTravelled = prevTravelled;
    travelled = distanceAtTime(raceTime);      // berechnet, nicht aufsummiert
    prevTravelled = travelled;

    // Nachplanen, solange der Vorrat knapp wird — die Strecke hört nie auf
    if (nextPlanIndex > plannedObstacles.length - 12) extendPlan();

    while (nextPlanIndex < plannedObstacles.length &&
           plannedObstacles[nextPlanIndex].dist - travelled < -SPAWN_Z) {
      const ob = plannedObstacles[nextPlanIndex];
      buildObstacle(ob);
      // Kam der Browser ins Stocken, ist die Strecke seit dem letzten Frame
      // weit gesprungen. Dann muss auch dieses Hindernis rückwirkend geprüft
      // werden, sonst läuft man durch Wände hindurch.
      ob.prevZ = lastTravelled - ob.dist;
      nextPlanIndex++;
    }

    // Tempostufe angekündigt
    const lvl = levelAtTime(raceTime);
    if (lvl !== lastLevel) {
      lastLevel = lvl;
      if (lvl > 0) {
        showToast('SPEED UP  ×' + (lvl + 1 + LEVEL_OFFSET));
        sfx.go();
        firePulse();
        camera.fov = 58 + Math.min(10, lvl * 1.1);
        camera.updateProjectionMatrix();
      }
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      o.z = -(o.dist - travelled);
      o.group.position.z = o.z;

      if (o.lava) {
    const rockMat = new THREE.MeshLambertMaterial({ color: 0x2A211E, flatShading: true });
    const hotMat = new THREE.MeshBasicMaterial({ color: 0xFF7A22 });
    const coreMat = new THREE.MeshBasicMaterial({ color: 0xFFD98A });

    if (o.kind === 'geyser') {
      o.jets = [];
      [].concat(o.groupA, o.groupB).forEach(l => {
        const jet = new THREE.Group();
        const col = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.95, 5.0, 10), hotMat);
        col.position.y = 2.5;
        const core = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.5, 4.6, 8), coreMat);
        core.position.y = 2.4;
        jet.add(col, core);
        jet.position.set(LANES[l], 0, 0);
        jet.scale.y = 0.001;
        grp.add(jet);
        // Krater am Boden, damit man sieht, wo es gleich losgeht
        const ring = new THREE.Mesh(new THREE.CylinderGeometry(1.15, 1.35, 0.35, 10), rockMat);
        ring.position.set(LANES[l], 0.15, 0);
        grp.add(ring);
        o.jets.push({ lane: l, mesh: jet, groupA: o.groupA.indexOf(l) >= 0 });
      });

    } else if (o.kind === 'lavaflow') {
      const len = o.zHalf * 2;
      const stream = new THREE.Mesh(new THREE.BoxGeometry(TRACK_HALF * 2 - 0.4, 0.28, len), hotMat);
      stream.position.y = 0.06;
      grp.add(stream);
      const bright = new THREE.Mesh(new THREE.BoxGeometry(TRACK_HALF * 2 - 2.4, 0.3, len * 0.55), coreMat);
      bright.position.y = 0.09;
      grp.add(bright);
      [-1, 1].forEach(sd => {
        const lip = new THREE.Mesh(new THREE.BoxGeometry(TRACK_HALF * 2, 0.5, 0.8), rockMat);
        lip.position.set(0, 0.2, sd * (o.zHalf + 0.3));
        grp.add(lip);
      });
      o.streamMat = hotMat;

    } else {                       // rockfall
      o.fallers = [];
      o.used.forEach(l => {
        const rk = new THREE.Mesh(new THREE.DodecahedronGeometry(1.15, 0), rockMat);
        rk.position.set(LANES[l], 30, 0);
        grp.add(rk);
        // Glut an der Unterseite
        const hot = new THREE.Mesh(new THREE.SphereGeometry(0.6, 8, 6), hotMat);
        hot.position.set(LANES[l], 29.4, 0);
        grp.add(hot);
        // Warnschatten am Boden
        const mark = new THREE.Mesh(new THREE.CircleGeometry(1.5, 16),
          new THREE.MeshBasicMaterial({ color: 0x120A08, transparent: true, opacity: 0.55 }));
        mark.rotation.x = -Math.PI / 2;
        mark.position.set(LANES[l], 0.05, 0);
        grp.add(mark);
        o.fallers.push({ rock: rk, hot, mark });
      });
    }

  } else if (o.air) {
        if (o.spinners) o.spinners.forEach(rk => { rk.rotation.x += dt * 2.2; rk.rotation.y += dt * 1.6; });
        if (o.flashes) {
          const on = Math.sin(travelled * 0.5 + o.dist) > 0.3;
          o.flashes.forEach(f => { f.material.opacity = on ? 0.95 : 0.15; });
        }
      }

      // Laser fährt auf und ab. Drei Dinge machen ihn lesbar statt zufällig:
      //  1. langsamer als vorher
      //  2. er hält sich fast immer ganz oben oder ganz unten auf
      //  3. ab 40 Einheiten vor dem Spieler friert er ein — was du siehst, kommt auch
      if (o.kind === 'laser' && o.boxes.length) {
        const tt = Math.min(travelled, o.dist - 40);
        const raw = Math.sin(o.laserPhase + tt * 0.030 * o.laserSpeed);
        const shaped = Math.sign(raw) * Math.pow(Math.abs(raw), 0.35);
        const y = 1.75 + shaped * 1.15;             // 0.60 bis 2.90
        o.boxes[0].yMin = y - 0.15;
        o.boxes[0].yMax = y + 0.15;
        if (o.core) o.core.position.y = y;
        if (o.halo) o.halo.position.y = y;
        if (o.knobs) o.knobs.forEach(k => { k.position.y = y; });

        // Farbe sagt an, was zu tun ist — gelb heisst springen, blau heisst ducken
        const mustJump = y < 1.09;
        const col = mustJump ? 0xFFC53D : 0x37B7F5;
        if (o.halo) o.halo.material.color.setHex(col);
        if (o.knobs) o.knobs.forEach(k => k.material.color.setHex(col));
        // eingefroren: Kern blinkt kurz auf
        if (travelled > o.dist - 40 && o.core) {
          o.core.material.color.setHex(0xFFFFFF);
        }
      }

      // Felsbrocken rollt uns entgegen — schneller als die Strecke
      if (o.boulder) {
        const shown = Math.max(0, travelled - (o.dist + SPAWN_Z));
        o.z = -(o.dist - travelled) + shown * o.approach;
        o.group.position.z = o.z;
        if (o.rocks) o.rocks.forEach(rk => { rk.rotation.x += dt * 9; });
      }

      // Wanderkiste pendelt seitlich — Position hängt nur an der Strecke,
      // ist also auf allen Rechnern identisch
      if (o.mover && o.boxes.length) {
        const base = LANES[o.used[0]];
        const span = o.moveRange * 2.3;
        const off = Math.sin(o.movePhase + travelled * 0.035 * o.moveSpeed) * span;
        // Auf der Brücke bleibt sie über dem tragenden Teil, sonst schwebt sie im Nichts
        const lim = inBridge(o.dist) ? BRIDGE_HALF - 0.6 : LANES[LANES.length - 1];
        const x = Math.max(-lim, Math.min(lim, base + off));
        o.boxes[0].x = x;
        if (o.meshes) o.meshes.forEach(pair => pair.forEach(m => {
          m.position.x = x + (m.geometry.type === 'ConeGeometry'
            ? (m.rotation.z > 0 ? 1.6 : -1.6) : 0);
        }));
      }
      whiteObstacle(o, whiteoutOn);

      // WICHTIG: erst prüfen, dann aufräumen. Stand der Browser still, wird ein
      // Hindernis unter Umständen erst gebaut, wenn es rechnerisch schon vorbei
      // ist — wurde es vorher weggeräumt, zählte der Treffer nie.
      const half = o.zHalf || 1.4;
      if (o.prevZ === undefined) o.prevZ = o.z;
      if (!o.checked && o.prevZ < half && o.z > -half) {
        if (me.alive && checkHit(me, o)) eliminate(me, false, o.kind === 'pit');
        if (!isNet) {
          runners.forEach(r => {
            if (r.alive && !r.isMe && checkHit(r, o)) eliminate(r, false, o.kind === 'pit');
          });
        }
      }
      if (o.z > half) o.checked = true;
      o.prevZ = o.z;
      if (o.z > DESPAWN_Z) { scene.remove(o.group); obstacles.splice(i, 1); }
    }

    // Boden, Häuser und Ziel mitziehen
    groundTiles.forEach(tile => {
      tile.position.z += speed * dt;
      if (tile.position.z > 10) tile.position.z -= 10 * groundTiles.length;
    });
    props.forEach(pr => {
      pr.position.z += speed * dt;
      if (pr.position.z > 40) pr.position.z -= 26 * 18;
    });

    // Läufer aktualisieren
    runners.forEach(r => {
      if (!r.alive) return;
      const special = updateActRunner(r, dt);
      if (!isNet && !r.isMe) botThink(r, dt);

      if (special) {
        // Im Flug gibt es drei feste Höhen — genau wie die Spuren. Das ist
        // treffsicher, statt eine stufenlose Höhe millimetergenau halten zu müssen.
        if (r.flying && r.isMe) {
          const targetY = BANDS[r.band];
          r.y += (targetY - r.y) * Math.min(1, dt * BAND_SNAP);
        } else if (!r.isMe && r.netY !== undefined) {
          r.y += (r.netY - r.y) * Math.min(1, dt * 14);
        }
        return;                                  // Schwerkraft und Ducken sind ausgesetzt
      }

      if (r.isMe || !isNet) {
        if (r.y > 0 || r.vy > 0) {
          r.vy -= GRAVITY * dt;
          r.y += r.vy * dt;
          if (r.y <= 0) { r.y = 0; r.vy = 0; if (r.isMe) sfx.land(); }
        }
        if (r.ducking) {
          const held = r.duckHeld;
          const minOver = performance.now() - r.duckSince > DUCK_MIN_MS;
          const botOver = r.duckUntil && performance.now() > r.duckUntil;
          if ((!held && minOver) || (botOver && !held)) { r.ducking = false; r.duckUntil = 0; }
        }
      } else if (r.netY !== undefined) {
        r.y += (r.netY - r.y) * Math.min(1, dt * 14);     // Mitspieler weich nachziehen
      }
    });

    // Auch im Netz melden, wenn nur noch einer läuft
    if (isNet && me.alive && !me.soloNoticed && runners.length > 1 && aliveRunners().length === 1) {
      me.soloNoticed = true;
      showToast('LAST ONE STANDING');
    }

    // Eigenen Zustand senden
    if (isNet && performance.now() - lastSend > 50) {
      lastSend = performance.now();
      Net.sendState({ l: me.lane, y: me.y, d: me.ducking ? 1 : 0, a: me.alive ? 1 : 0 });
    }

    applyBiome((travelled % (BIOME_LENGTH * BIOMES.length)) / (BIOME_LENGTH * BIOMES.length));
    updateTunnel(dt, t);
    updateAct(dt, t);
    updateBridge();
    updateProps();
    updateStorm(dt);
    updateStreaks(dt);
    updatePulse(dt);

    // Wer auf der Brücke zu weit aussen läuft, stürzt ab
    if (me.alive && me.y < 0.45 && Math.abs(me.laneX) > BRIDGE_HALF + 0.15
        && inBridge(travelled)) {
      eliminate(me, false, true);
      showToast('OFF THE EDGE');
    }

    // HUD
    const stepPct = ((raceTime % STEP_SEC) / STEP_SEC) * 100;
    $('progress').style.width = stepPct + '%';
    $('dist').textContent = Math.round(travelled / METER_SCALE) + 'm';
    $('lvl').textContent = '×' + (lvl + 1 + LEVEL_OFFSET);
    const rank = aliveRunners().length;
    $('place').textContent = me.alive
      ? (rank + (rank === 1 ? 'st' : rank === 2 ? 'nd' : rank === 3 ? 'rd' : 'th'))
      : '—';
  }

  runners.forEach(r => updateRunnerVisual(r, dt, t));

  const camTargetX = me ? me.laneX * 0.45 : 0;
  camera.position.x += (camTargetX - camera.position.x) * Math.min(1, dt * 4);
  const camY = me ? (me.flying ? 3.4 + me.y * 0.55 : 5.4 + Math.max(0, me.y) * 0.25 + Math.min(0, me.y) * 0.8) : 5.4;
  camera.position.y += (camY - camera.position.y) * Math.min(1, dt * 5);
  const totalShake = shake + quakeShake;
  if (shake > 0) shake = Math.max(0, shake - dt * 1.8);
  if (totalShake > 0) {
    camera.position.x += (Math.random() - 0.5) * totalShake;
    camera.position.y += (Math.random() - 0.5) * totalShake;
  }
  camera.lookAt(camTargetX * 0.6, 1.9, -14);
  // Schräglage: die Strecke scheint sich zu neigen
  const bank = (state === 'running') ? bankAngle(travelled) : 0;
  camera.rotation.z += (bank - camera.rotation.z) * Math.min(1, dt * 3);

  renderer.render(scene, camera);
}

/* ---------------- Start ---------------- */

if (typeof THREE === 'undefined') {
  // Ohne Three.js geht gar nichts — das passiert, wenn eine Vorschau- oder
  // Firewall-Umgebung das CDN blockt. Lieber deutlich sagen als stumm scheitern.
  const box = $('net-note');
  if (box) box.innerHTML = '<b style="color:#E4322F">3D-Bibliothek konnte nicht geladen werden.</b>' +
    '<br>Auf GitHub Pages oder über einen lokalen Server öffnen.';
  ['btn-play', 'btn-host', 'btn-join'].forEach(id => {
    const b = $(id); if (b) { b.style.opacity = .4; b.style.pointerEvents = 'none'; }
  });
  return;
}

try {
  initScene();
  buildTrack();
  buildVolcanoes();
  buildClouds();
  buildUfo();
  buildTunnel();
  buildStreaks();
  bindInput();
  frame();
} catch (err) {
  console.error('[LAST RUNNER] Start fehlgeschlagen:', err);
  const box = $('net-note');
  if (box) box.innerHTML = '<b style="color:#E4322F">Start fehlgeschlagen:</b> ' + err.message;
  return;
}

const readName = () => ($('nm').value || 'RUNNER').trim().slice(0, 10).toUpperCase() || 'RUNNER';
const wakeAudio = () => {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
};

$('btn-play').addEventListener('click', () => {
  wakeAudio();
  startSolo();
});

$('btn-host').addEventListener('click', () => {
  wakeAudio();
  note('Opening room …');
  Net.host(readName());
});

$('btn-join').addEventListener('click', () => {
  wakeAudio();
  const c = ($('code').value || '').trim().toUpperCase();
  if (!/^[A-Z]{4}$/.test(c)) { note('Room codes are four letters'); return; }
  note('Connecting to ' + c + ' …');
  Net.join(c, readName());
});

$('btn-start').addEventListener('click', () => {
  if (!Net.isHost()) return;
  if (Net.roster.length < 2) { $('lobby-note').textContent = 'At least two runners needed'; return; }
  const seed = Net.startRound();
  beginRace(seed);
});

$('btn-leave').addEventListener('click', () => { Net.leave(); backToMenu(); note(''); });

$('btn-again').addEventListener('click', () => {
  if (Net.isOnline()) {
    if (Net.isHost()) { const seed = Net.startRound(); beginRace(seed); }
    else {
      $('results').classList.add('hidden');
      $('lobby').classList.remove('hidden');
      $('lobby-note').textContent = 'Waiting for the host to start the next race';
    }
  } else {
    startSolo();
  }
});

$('btn-menu').addEventListener('click', () => { Net.leave(); backToMenu(); });

['nm', 'code'].forEach(id => $(id).addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); $('btn-join').click(); }
}));

note(window.Peer ? '' : 'PeerJS not loaded — multiplayer unavailable');

})();
</script>

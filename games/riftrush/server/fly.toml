# Deployment auf Fly.io:
#   cd server && fly launch --copy-config --now
app = "riftrush-signaling"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

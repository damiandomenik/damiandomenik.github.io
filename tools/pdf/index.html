<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pdf-toolbox — merge, split and convert PDFs in your browser</title>
<meta name="description" content="Merge, organize, split, rotate and convert PDFs. Everything runs client-side; your files never leave your browser.">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="./css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23070b0d'/><text x='2' y='12' font-family='monospace' font-size='11' fill='%233dff8f'>%3E_</text></svg>">

<!-- Third-party libraries, loaded from CDN as classic scripts (globals: pdfjsLib, PDFLib, JSZip).
     They are code, not a service: no file ever gets sent to them. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
<div class="crt" aria-hidden="true"></div>

<header class="topbar">
  <a class="brand" href="#/">pdf<span class="dim">-</span>toolbox</a>
  <nav class="topnav" id="topnav" aria-label="Tools"></nav>
  <a class="back" href="../">../</a>
</header>

<main id="view" class="view" tabindex="-1"></main>

<div class="statusline" role="status" aria-live="polite">
  <span class="st-lock">🔒 Your files never leave your browser.</span>
  <span class="st-spacer"></span>
  <span class="st-info" id="statusinfo">idle</span>
</div>

<div id="toasts" class="toasts" aria-live="assertive"></div>

<div id="overlay" class="overlay" hidden>
  <div class="overlay-box" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
    <p class="overlay-title" id="overlay-title">Working…</p>
    <div class="bar"><div class="bar-fill" id="overlay-bar"></div></div>
    <p class="overlay-sub" id="overlay-sub"></p>
  </div>
</div>

<script type="module" src="./js/main.js"></script>
<noscript><p style="padding:24px;font-family:monospace;color:#cfe8dd">This tool runs on JavaScript in your browser. With JavaScript off there is nothing to run — and no server to fall back to.</p></noscript>
</body>
</html>

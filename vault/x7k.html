<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>df // vault</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:      #050806;
    --panel:   #0a0f0b;
    --border:  #1c2a1e;
    --text:    #c9d6cb;
    --dim:     #5a6b5c;
    --green:   #c8f55a;   /* portfolio accent, the link to the main site */
    --phos:    #4ee37a;   /* terminal phosphor green */
    --red:     #ff5f56;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }
  /* faint scanline texture */
  body::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background: repeating-linear-gradient(
      to bottom,
      rgba(78,227,122,0.025) 0px,
      rgba(78,227,122,0.025) 1px,
      transparent 1px,
      transparent 3px
    );
  }
  a { color: var(--phos); text-decoration: none; }

  .blink { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---------- LOGIN ---------- */
  #loginWrap {
    position: relative; z-index: 2;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 1.2rem;
  }
  .term {
    width: 100%; max-width: 440px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    box-shadow: 0 0 0 1px #000, 0 24px 60px rgba(0,0,0,0.6);
    overflow: hidden;
  }
  .term-bar {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0.6rem 0.9rem;
    border-bottom: 1px solid var(--border);
    background: #070b08;
  }
  .dot { width: 11px; height: 11px; border-radius: 50%; }
  .dot.r { background: #ff5f56; } .dot.y { background: #ffbd2e; } .dot.g { background: #27c93f; }
  .term-title { margin-left: 0.5rem; color: var(--dim); font-size: 12px; letter-spacing: 0.05em; }
  .term-body { padding: 1.6rem 1.4rem 1.8rem; }

  .brand {
    font-weight: 700; font-size: 1.05rem; letter-spacing: 0.06em;
    margin-bottom: 1.4rem;
  }
  .brand .df { color: var(--green); }
  .brand .sub { color: var(--dim); font-weight: 400; }

  .line { color: var(--dim); font-size: 12.5px; margin-bottom: 0.5rem; }
  .line .p { color: var(--phos); }

  label { display: block; color: var(--dim); font-size: 12px; margin: 0.9rem 0 0.3rem; }
  input {
    width: 100%; padding: 0.6rem 0.7rem;
    background: #060a07; color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    font-family: inherit; font-size: 14px;
  }
  input:focus { outline: none; border-color: var(--phos); }

  button {
    font-family: inherit; font-size: 13px; font-weight: 500;
    cursor: pointer; border: 1px solid var(--border);
    background: #0c130d; color: var(--phos);
    padding: 0.55rem 0.9rem; border-radius: 4px;
    transition: background 0.15s, border-color 0.15s;
  }
  button:hover { background: #111a12; border-color: var(--phos); }

  #loginBtn { width: 100%; margin-top: 1.2rem; }
  #status { margin-top: 0.9rem; font-size: 12.5px; min-height: 16px; color: var(--dim); }
  #status.err { color: var(--red); }

  /* ---------- APP ---------- */
  #app { display: none; position: relative; z-index: 2; max-width: 820px; margin: 0 auto; padding: 1.4rem 1.2rem 4rem; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 1rem; margin-bottom: 1.4rem;
    border-bottom: 1px solid var(--border);
  }
  .topbar .brand { margin: 0; }
  .top-right { display: flex; align-items: center; gap: 1rem; }
  .who { color: var(--dim); font-size: 12px; }
  .lnk { color: var(--dim); font-size: 12.5px; border: 1px solid var(--border); padding: 0.35rem 0.7rem; border-radius: 4px; }
  .lnk:hover { color: var(--phos); border-color: var(--phos); }

  .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.2rem; }
  .tab { color: var(--dim); }
  .tab::before { content: "› "; color: var(--border); }
  .tab.active { color: var(--phos); border-color: var(--phos); background: #0c130d; }
  .tab.active::before { content: "› "; color: var(--phos); }

  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 6px; padding: 1.2rem; margin-bottom: 1.4rem;
  }
  .card .hd { color: var(--dim); font-size: 12px; margin-bottom: 0.9rem; letter-spacing: 0.05em; }
  .card .hd .p { color: var(--phos); }
  textarea {
    width: 100%; min-height: 130px; resize: vertical;
    padding: 0.6rem 0.7rem; background: #060a07; color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    font-family: inherit; font-size: 13px; line-height: 1.55;
  }
  textarea:focus { outline: none; border-color: var(--phos); }
  .card input { margin-bottom: 0.7rem; }
  #saveStatus { margin-left: 0.8rem; font-size: 12px; color: var(--dim); }

  .entry {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 6px; padding: 1rem 1.1rem; margin-bottom: 0.9rem;
  }
  .entry-head { display: flex; align-items: baseline; justify-content: space-between; gap: 0.6rem; }
  .entry-title { color: var(--text); font-weight: 500; }
  .entry-title::before { content: "■ "; color: var(--phos); font-size: 0.8em; }
  .entry-date { color: var(--dim); font-size: 11.5px; white-space: nowrap; }
  .arrow { color: var(--phos); margin-left: 0.3rem; }
  .entry-note { color: var(--dim); font-size: 12.5px; margin-top: 0.4rem; }
  .entry pre {
    background: #060a07; border: 1px solid var(--border); border-radius: 4px;
    padding: 0.8rem; margin-top: 0.7rem; overflow-x: auto;
    font-size: 12.5px; white-space: pre-wrap; word-break: break-word; color: var(--text);
  }
  .entry-link { margin-top: 0.7rem; word-break: break-all; }
  .dl-btn {
    display: inline-block; padding: 0.5rem 1.1rem;
    border: 1px solid var(--phos); border-radius: 4px;
    color: var(--phos); font-size: 13px; text-decoration: none;
    transition: background 0.15s;
  }
  .dl-btn:hover { background: #0c130d; }
  .entry-actions { display: flex; gap: 0.5rem; margin-top: 0.8rem; }
  .entry-actions button { font-size: 12px; padding: 0.35rem 0.7rem; }
  .btn-del { color: var(--red); }
  .btn-del:hover { border-color: var(--red); background: #160a0a; }
  .empty { color: var(--dim); font-size: 12.5px; padding: 0.4rem 0; }
  .empty::before { content: "// "; color: var(--border); }

  @media (max-width: 560px) {
    .topbar { flex-direction: column; align-items: flex-start; gap: 0.8rem; }
  }
  @media (prefers-reduced-motion: reduce) { .blink { animation: none; } }
</style>
</head>
<body>

  <!-- LOGIN -->
  <div id="loginWrap">
    <div class="term">
      <div class="term-bar">
        <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
        <span class="term-title">df@vault — authenticate</span>
      </div>
      <div class="term-body">
        <div class="brand"><a href="../index.html" style="text-decoration:none;"><span class="df">DF</span></a> <span class="sub">// vault</span></div>
        <div class="line"><span class="p">$</span> access requires identity<span class="blink">_</span></div>

        <label for="email">email</label>
        <input type="email" id="email" autocomplete="username">
        <label for="password">passphrase</label>
        <input type="password" id="password" autocomplete="current-password">

        <button id="loginBtn">authenticate →</button>
        <div id="status"></div>
      </div>
    </div>
  </div>

  <!-- APP -->
  <div id="app">
    <div class="topbar">
      <div class="brand"><a href="../index.html" style="text-decoration:none;"><span class="df">DF</span></a> <span class="sub">// vault</span></div>
      <div class="top-right">
        <span class="who" id="who"></span>
        <a class="lnk" href="../index.html">[ back ]</a>
        <button id="logoutBtn">logout</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" data-kat="code">codes</button>
      <button class="tab" data-kat="link">links</button>
      <button class="tab" data-kat="download">downloads</button>
    </div>

    <div class="card">
      <div class="hd"><span class="p">$</span> <span id="formTitel">new code</span></div>
      <input type="text" id="titel" placeholder="title">
      <textarea id="inhalt" placeholder="paste code here"></textarea>
      <input type="text" id="notiz" placeholder="note (optional)">
      <button id="saveBtn">save →</button>
      <span id="saveStatus"></span>
    </div>

    <div id="liste"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import {
      getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
    import {
      getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc,
      query, where, orderBy, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCiyNoLKTnxBM4oEP2RSLPoeG8HWV1rDTU",
      authDomain: "ablage-21e9e.firebaseapp.com",
      projectId: "ablage-21e9e",
      storageBucket: "ablage-21e9e.firebasestorage.app",
      messagingSenderId: "1009208526925",
      appId: "1:1009208526925:web:1a361c47c380c701267404"
    };

    const appFb = initializeApp(firebaseConfig);
    const auth = getAuth(appFb);
    const db = getFirestore(appFb);

    let aktuelleKategorie = "code";
    let aktuellerUser = null;
    let bearbeiteId = null;   // null = neuer Eintrag, sonst die ID des bearbeiteten

    const loginWrap = document.getElementById("loginWrap");
    const app = document.getElementById("app");
    const statusEl = document.getElementById("status");
    const saveStatus = document.getElementById("saveStatus");

    function zeigeOberflaeche(user) {
      aktuellerUser = user;
      if (user) {
        loginWrap.style.display = "none";
        app.style.display = "block";
        document.getElementById("who").textContent = user.email;
        ladeEintraege();
      } else {
        loginWrap.style.display = "flex";
        app.style.display = "none";
      }
    }

    onAuthStateChanged(auth, (user) => zeigeOberflaeche(user));

    document.getElementById("loginBtn").addEventListener("click", async () => {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      statusEl.textContent = "verifying..."; statusEl.className = "";
      try {
        await signInWithEmailAndPassword(auth, email, password);
        statusEl.textContent = "";
      } catch (e) {
        statusEl.textContent = "access denied — " + e.code;
        statusEl.className = "err";
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await signOut(auth);
    });

    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        aktuelleKategorie = tab.dataset.kat;
        let titelText, platzhalter;
        if (aktuelleKategorie === "code") {
          titelText = "new code"; platzhalter = "paste code here";
        } else if (aktuelleKategorie === "link") {
          titelText = "new link"; platzhalter = "https://...";
        } else {
          titelText = "new download"; platzhalter = "https://... (link to file)";
        }
        document.getElementById("formTitel").textContent = titelText;
        document.getElementById("inhalt").placeholder = platzhalter;
        // Bearbeiten-Modus zurücksetzen beim Reiterwechsel
        bearbeiteId = null;
        document.getElementById("saveBtn").textContent = "save →";
        ladeEintraege();
      });
    });

    document.getElementById("saveBtn").addEventListener("click", async () => {
      const titel = document.getElementById("titel").value.trim();
      const inhalt = document.getElementById("inhalt").value.trim();
      const notiz = document.getElementById("notiz").value.trim();
      if (!titel || !inhalt) { saveStatus.textContent = "title and content required"; return; }

      saveStatus.textContent = "saving...";
      try {
        if (bearbeiteId) {
          // bestehenden Eintrag aktualisieren
          await updateDoc(doc(db, "ablage", bearbeiteId), {
            user_id: aktuellerUser.uid,
            kategorie: aktuelleKategorie,
            titel, inhalt,
            notiz: notiz || null,
            erstellt_am: serverTimestamp()
          });
          bearbeiteId = null;
          document.getElementById("saveBtn").textContent = "save →";
        } else {
          // neuen Eintrag anlegen
          await addDoc(collection(db, "ablage"), {
            user_id: aktuellerUser.uid,
            kategorie: aktuelleKategorie,
            titel, inhalt,
            notiz: notiz || null,
            erstellt_am: serverTimestamp()
          });
        }
        document.getElementById("titel").value = "";
        document.getElementById("inhalt").value = "";
        document.getElementById("notiz").value = "";
        saveStatus.textContent = "saved ✓";
        setTimeout(() => saveStatus.textContent = "", 1500);
        ladeEintraege();
      } catch (e) {
        saveStatus.textContent = "error: " + e.message;
      }
    });

    async function ladeEintraege() {
      const liste = document.getElementById("liste");
      liste.innerHTML = "<p class='empty'>loading...</p>";
      try {
        const q = query(
          collection(db, "ablage"),
          where("user_id", "==", aktuellerUser.uid),
          where("kategorie", "==", aktuelleKategorie),
          orderBy("erstellt_am", "desc")
        );
        const snap = await getDocs(q);
        if (snap.empty) { liste.innerHTML = "<p class='empty'>nothing stored yet</p>"; return; }

        liste.innerHTML = "";
        snap.forEach(d => {
          const e = d.data();
          const id = d.id;
          const div = document.createElement("div");
          div.className = "entry";

          let datum = "";
          if (e.erstellt_am && e.erstellt_am.toDate) {
            datum = e.erstellt_am.toDate().toLocaleString("de-CH");
          }
          const notizHtml = e.notiz ? `<div class="entry-note">// ${escapeHtml(e.notiz)}</div>` : "";

          let body;
          if (e.kategorie === "link") {
            const url = escapeHtml(e.inhalt);
            body = `<div class="entry-link"><a href="${url}" target="_blank" rel="noopener">${url}</a></div>`;
          } else if (e.kategorie === "download") {
            const url = escapeHtml(e.inhalt);
            body = `<div class="entry-link"><a class="dl-btn" href="${url}" download target="_blank" rel="noopener">↓ download</a></div>`;
          } else {
            body = `<pre>${escapeHtml(e.inhalt)}</pre>`;
          }

          div.innerHTML = `
            <div class="entry-head">
              <span class="entry-title">${escapeHtml(e.titel)}</span>
              <span class="entry-date">${datum} <span class="arrow">▸</span></span>
            </div>
            <div class="entry-body" style="display:none;">
              ${notizHtml}
              ${body}
              <div class="entry-actions">
                <button class="btn-copy">copy</button>
                <button class="btn-edit">edit</button>
                <button class="btn-del">delete</button>
              </div>
            </div>
          `;

          // Kopf klickbar: auf-/zuklappen
          const kopf = div.querySelector(".entry-head");
          const koerper = div.querySelector(".entry-body");
          const pfeil = div.querySelector(".arrow");
          kopf.style.cursor = "pointer";
          kopf.addEventListener("click", (ev) => {
            // Klick auf copy/delete soll nicht zuklappen
            if (ev.target.closest(".entry-actions")) return;
            const offen = koerper.style.display !== "none";
            koerper.style.display = offen ? "none" : "block";
            pfeil.textContent = offen ? "▸" : "▾";
          });

          div.querySelector(".btn-copy").addEventListener("click", () => {
            navigator.clipboard.writeText(e.inhalt);
            const b = div.querySelector(".btn-copy");
            b.textContent = "copied ✓";
            setTimeout(() => b.textContent = "copy", 1200);
          });

          div.querySelector(".btn-edit").addEventListener("click", () => {
            // Felder oben mit den Werten füllen und in den Bearbeiten-Modus gehen
            document.getElementById("titel").value = e.titel;
            document.getElementById("inhalt").value = e.inhalt;
            document.getElementById("notiz").value = e.notiz || "";
            bearbeiteId = id;
            document.getElementById("saveBtn").textContent = "update →";
            // nach oben zum Formular scrollen
            document.getElementById("titel").scrollIntoView({ behavior: "smooth", block: "center" });
            document.getElementById("titel").focus();
          });

          div.querySelector(".btn-del").addEventListener("click", async () => {
            if (!confirm("delete this entry?")) return;
            await deleteDoc(doc(db, "ablage", id));
            ladeEintraege();
          });

          liste.appendChild(div);
        });
      } catch (e) {
        liste.innerHTML = "<p class='empty'>error: " + e.message + "</p>";
      }
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }
  </script>

</body>
</html>

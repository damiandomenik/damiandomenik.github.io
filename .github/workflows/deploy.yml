name: Deploy Arena Rumble to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GAME_PATH: games/arena-rumble

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ env.GAME_PATH }}/package-lock.json

      - name: Install
        working-directory: ${{ env.GAME_PATH }}
        run: npm ci

      - name: Build
        working-directory: ${{ env.GAME_PATH }}
        run: npm run build

      - name: Stage the site
        run: |
          mkdir -p _site
          rsync -a --exclude '_site' --exclude '.git' --exclude 'node_modules' ./ _site/
          rm -rf "_site/${GAME_PATH}"
          mkdir -p "_site/${GAME_PATH}"
          cp -r "${GAME_PATH}/dist/." "_site/${GAME_PATH}/"

      - name: Show what will be published
        run: find _site -maxdepth 3 -not -path '*/.*' | sort | head -40

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
